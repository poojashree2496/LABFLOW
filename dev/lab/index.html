<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LABFLOW Test Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/lab/lab.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">Labflow</span><span class="dev">Test Lab</span></div>
    <div class="clock" id="clock" aria-live="polite">--</div>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <div class="layout">
    <nav class="side" id="nav" aria-label="Test Lab sections"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/lab/lab.js"></script>
</body>
</html>
