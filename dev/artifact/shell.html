<title>LABFLOW Live Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a navy header with the simulated clock, tabs, then one working area per tab; LABFLOW Test Lab navy and gold. */
:root {
  --bg: #f3f5fa; --panel: #ffffff; --panel-2: #eef1f8; --line: #d7ddea; --ink: #13203d; --soft: #57637d;
  --gold: #b9830f; --gold-soft: #fbf0d6; --brand: #2f62c8; --brand-ink: #ffffff;
  --good: #15845a; --good-soft: #e0f3e9; --warn: #a46700; --warn-soft: #fbefd9; --bad: #c23c3c; --bad-soft: #f8e2e2; --skip: #7b5bd6;
  --disp: "Barlow Condensed", "Arial Narrow", sans-serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1424; --panel: #131d33; --panel-2: #18243f; --line: #263453; --ink: #e7ecf6; --soft: #97a5c0;
  --gold: #f2b83a; --gold-soft: #2c2512; --brand: #3d72dc; --brand-ink: #ffffff;
  --good: #3ccf86; --good-soft: #12301f; --warn: #f0b84a; --warn-soft: #2e2410; --bad: #f26b6b; --bad-soft: #351717; --skip: #a78bfa; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1424; --panel: #131d33; --panel-2: #18243f; --line: #263453; --ink: #e7ecf6; --soft: #97a5c0;
  --gold: #f2b83a; --gold-soft: #2c2512; --brand: #3d72dc; --brand-ink: #ffffff;
  --good: #3ccf86; --good-soft: #12301f; --warn: #f0b84a; --warn-soft: #2e2410; --bad: #f26b6b; --bad-soft: #351717; --skip: #a78bfa; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
a { color: var(--brand); }
code, .mono { font-family: var(--mono); font-size: .9em; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { background: #0a2252; color: #e7ecf6; border-bottom: 3px solid #f2b83a; }
header.top .gut { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.mark { font: 700 28px/1 var(--disp); letter-spacing: .06em; text-transform: uppercase; }
.tag { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #0a2252; background: #f2b83a; padding: 5px 8px; border-radius: 4px; }
.clockbox { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.clock { font: 600 15px/1.2 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.clock small { display: block; color: #9fb0d0; font: 500 10.5px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.hbtn { border: 1px solid #2b4479; background: #12306b; color: #e7ecf6; border-radius: 6px; padding: 5px 10px; font-weight: 600; font-size: 13px; cursor: pointer; }
.hbtn:hover { border-color: #f2b83a; }
.notice { background: var(--gold-soft); border-bottom: 1px solid var(--line); font-size: 13px; }
.notice .gut { max-width: 1440px; margin: 0 auto; padding-block: 7px; }

nav.tabs { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
nav.tabs .gut { display: flex; gap: 2px; overflow-x: auto; max-width: 1440px; margin: 0 auto; }
nav.tabs button { all: unset; cursor: pointer; padding: 11px 14px; font-weight: 600; color: var(--soft); white-space: nowrap; border-bottom: 3px solid transparent; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold); }
nav.tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }

main .gut { max-width: 1440px; margin: 0 auto; padding-block: 20px 60px; }
section.view { display: grid; gap: 16px; min-width: 0; }
h1 { font: 700 32px/1.05 var(--disp); letter-spacing: .03em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; margin: 0; letter-spacing: .01em; }
h3 { font: 600 11px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 0; }
p { margin: 0; max-width: 78ch; }
.lead { color: var(--soft); }
.hint { color: var(--soft); font-size: 12.5px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--soft); font-weight: 600; min-width: 0; }
.input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.gold { background: #f2b83a; border-color: #f2b83a; color: #1d1500; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font: 600 11.5px/1.6 var(--sans); border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.chip.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.chip.mode { font-family: var(--mono); }
.tablebox { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.pick { cursor: pointer; } tr.pick:hover td { background: var(--panel-2); } tr.sel td { background: var(--gold-soft); }
.trace { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); display: grid; gap: 6px; min-width: 0; }
.trace.ok { border-left-color: var(--good); } .trace.bad { border-left-color: var(--bad); }
.trace pre { margin: 0; overflow: auto; max-height: 220px; font: 12px/1.45 var(--mono); color: var(--soft); white-space: pre-wrap; word-break: break-word; }
details > summary { cursor: pointer; color: var(--soft); font-size: 12.5px; }
.chain { display: flex; flex-wrap: wrap; gap: 4px; }

/* map */
.map svg { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; user-select: none; }
.m-grid { stroke: var(--line); stroke-width: .6; }
.m-fence { fill: var(--gold-soft); stroke: var(--gold); stroke-width: 1.4; cursor: pointer; }
.m-fence.sel { stroke-width: 3; }
.m-dot { fill: var(--gold); }
.m-code { font: 700 9px var(--mono); fill: var(--ink); pointer-events: none; }
.m-sub { font: 500 6.5px var(--sans); fill: var(--soft); pointer-events: none; }
.m-scale { stroke: var(--ink); stroke-width: 1.2; } .m-scale-t { font: 600 7px var(--sans); fill: var(--ink); }
.m-pin { fill: var(--brand); stroke: var(--panel); stroke-width: 1.5; cursor: grab; }
.m-acc { fill: var(--brand); fill-opacity: .12; stroke: var(--brand); stroke-width: .7; stroke-dasharray: 2 2; pointer-events: none; }
.m-pin-t { font: 600 7px var(--sans); fill: var(--brand); pointer-events: none; }

/* stage and app frames */
.stage { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.framehead { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.screen { border: 8px solid #1b2234; border-radius: 12px; background: #fff; overflow: hidden; }
.screen iframe { display: block; width: 100%; height: 560px; border: 0; }
.device { border: 10px solid #1b2234; border-radius: 30px; background: #fff; overflow: hidden; max-width: 400px; width: 100%; justify-self: center; }
.device iframe { display: block; width: 100%; height: 720px; border: 0; }
.appbox { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.appbox iframe { display: block; width: 100%; height: 820px; border: 0; }
.roles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.role { all: unset; cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 11px; display: grid; gap: 2px; }
.role:hover { border-color: var(--brand); }
.role[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }
.role:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.role b { font-size: 13.5px; } .role span { font-size: 12px; color: var(--soft); }
.relay .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 5px; min-width: 0; }
.relay .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* start */
.tiers { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.tier { border-top: 3px solid var(--gold); }
.tier .num { font: 700 12.5px/1 var(--mono); color: var(--gold); letter-spacing: .06em; }
.tier h2 { font: 700 22px/1.1 var(--disp); letter-spacing: .02em; text-transform: uppercase; }
.say { border-left: 3px solid var(--line); padding-left: 10px; color: var(--soft); font-style: italic; }
ol.run { margin: 0; padding: 0; list-style: none; counter-reset: run; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
ol.run li { counter-increment: run; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
ol.run li:last-child { border-bottom: 0; }
ol.run li::before { content: counter(run, decimal-leading-zero); font: 700 15px/1 var(--mono); color: var(--gold); }
ol.run strong { display: block; } ol.run span { color: var(--soft); font-size: 13.5px; }
.note { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; z-index: 20; }
.toast { background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: 340px; }
.toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 1100px) { .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stage > :first-child { grid-column: 1 / -1; } }
@media (max-width: 720px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .clockbox { margin-left: 0; }
  ol.run li { grid-template-columns: 30px minmax(0, 1fr); } ol.run li > .btn { grid-column: 2; justify-self: start; }
  .appbox iframe { height: 720px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="gut">
    <div class="brand"><span class="mark">Labflow</span><span class="tag">Live demo</span></div>
    <div class="clockbox">
      <div class="clock" id="clock" aria-live="off">--</div>
      <button class="hbtn" type="button" id="adv">+5 min</button>
      <button class="hbtn" type="button" id="tick">Run tick</button>
      <button class="hbtn" type="button" id="reset">Reset demo</button>
    </div>
  </div>
</header>
<div class="notice"><div class="gut"><strong>Simulated data.</strong> The real LABFLOW server code runs inside this page on a demo department. Nothing here reaches the live system or any real account, and every change resets when the page reloads.</div></div>
<nav class="tabs" aria-label="Demo sections"><div class="gut" id="tabs"></div></nav>
<main><div class="gut" id="main"></div></main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>/*@ENV@*/</script>
<script>/*@ENGINE@*/</script>
<script>/*@DEMO@*/</script>
<script>/*@DATA@*/</script>
<script>
(function () {
'use strict';
var D = LFDEMO(LFENV, LFENGINE, LFDATA.snapshot, LFDATA.startNow);

/* ------------------------------------------------------------------ small helpers */
function h(tag, props) {
  var el = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
  if (props) Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v === undefined || v === null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  });
  (function add(list) { list.forEach(function (c) { if (c === null || c === undefined || c === false) return; if (Array.isArray(c)) add(c); else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c))); }); })(kids);
  return el;
}
var $ = function (s) { return document.querySelector(s); };
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
function fill(el, list) { clear(el); (function add(l) { l.forEach(function (c) { if (Array.isArray(c)) add(c); else if (c) el.appendChild(c); }); })(list); }
function toast(msg, bad) { var t = h('div', { class: 'toast' + (bad ? ' bad' : '') }, msg); $('#toasts').appendChild(t); setTimeout(function () { t.remove(); }, bad ? 6000 : 2800); }
function btn(label, fn, cls) { return h('button', { type: 'button', class: 'btn ' + (cls || ''), onclick: async function (e) { var b = e.currentTarget; b.disabled = true; try { await fn(e); } catch (x) { toast(String(x.message || x), true); } finally { b.disabled = false; } } }, label); }
function select(id, options, value) { return h('select', { class: 'input', id: id }, options.map(function (o) { return h('option', { value: o[0], selected: o[0] === value }, o[1]); })); }
var IST = 330 * 60000;
var hhmm = function (ms) { return new Date(ms + IST).toISOString().slice(11, 16); };
var dayName = function (ms) { var d = new Date(ms + IST); return d.toUTCString().slice(0, 11).replace(',', ''); };

var S = D.state();
function refresh() { S = D.state(); drawClock(); }
function drawClock() { var n = D.now(); clear($('#clock')).append(dayName(n) + ' 2026 · ' + new Date(n + IST).toISOString().slice(11, 19) + ' IST', h('small', null, 'simulated clock')); }
drawClock(); setInterval(drawClock, 1000);
setInterval(function () { try { D.tick(); } catch (e) { /* shown when run by hand */ } }, 60000);
$('#adv').onclick = function () { D.advance(300000); refresh(); toast('Clock moved 5 minutes'); };
$('#tick').onclick = function () { var r = D.tick(); refresh(); toast('Tick ran: ' + Object.keys(r || {}).map(function (k) { return k + ' ' + JSON.stringify(r[k]); }).join(', ').slice(0, 160)); };
$('#reset').onclick = function () { D.reset(); keyStore = {}; relay.items = {}; refresh(); frames.forEach(function (f) { f.setAs(f.as); }); toast('Demo reset to the start of the day'); };

/* ------------------------------------------------------------------ where the phones are */
var labs = S.labs, home = labs.find(function (l) { return l.code === 'IOT01'; }) || labs[0];
var geo = { lat: home.latitude + 4 / 111320, lng: home.longitude, accuracy: 12, denied: false };
var geoListeners = [];
function setGeo(p) { Object.assign(geo, p); geoListeners.forEach(function (f) { f(); }); }
function metres(a, b) { var r = Math.PI / 180, x = (b.lng - a.lng) * r * Math.cos((a.lat + b.lat) * r / 2), y = (b.lat - a.lat) * r; return Math.round(Math.sqrt(x * x + y * y) * 6371000); }
function placeNear(lab, m, acc) { setGeo({ lat: lab.latitude + m / 111320, lng: lab.longitude, accuracy: acc === undefined ? 12 : acc, denied: false }); }

/* ------------------------------------------------------------------ the real app in frames, talking to this page */
/* Runs inside each app frame: replaces google.script.run, location and the camera relay with messages to this page. */
function bridge(as) {
  var seq = 0, waiting = {};
  var send = function (m) { m.lf = 1; parent.postMessage(m, '*'); };
  var ask = function (type, extra, cb) { var id = ++seq; waiting[id] = cb; extra.type = type; extra.id = id; extra.as = as; send(extra); };
  addEventListener('message', function (ev) {
    var d = ev.data || {}; if (d.lf !== 1) return;
    if (d.type === 'res' && waiting[d.id]) { var cb = waiting[d.id]; delete waiting[d.id]; cb(d.result); }
    if (d.type === 'open' && window.LF) {
      var q = (String(d.text).split('?')[1] || '').split('&'), k = '', s = '';
      q.forEach(function (p) { var kv = p.split('='); if (kv[0] === 'k') k = decodeURIComponent(kv[1] || ''); if (kv[0] === 's') s = decodeURIComponent(kv[1] || ''); });
      if (k && LF.kioskCheckin) LF.kioskCheckin(k); else if (s && LF.scanLink) LF.scanLink(s); else if (LF.toast) LF.toast('Not a LABFLOW link', 'bad');
    }
    if (d.type === 'type') {
      // a USB barcode scanner types the code into the focused scanner box and presses Enter
      var box = document.querySelector('input[placeholder^="Scan, or paste"]');
      if (!box) { if (window.LF && LF.toast) LF.toast('This screen has no scanner box open', 'bad'); return; }
      box.value = String(d.text); box.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    }
  });
  function chain(ok, bad) { return { withSuccessHandler: function (f) { return chain(f, bad); }, withFailureHandler: function (f) { return chain(ok, f); },
    rpc: function (action, payload) { ask('rpc', { action: action, payload: payload }, function (r) { if (ok) ok(r); }); } }; }
  window.google = { script: { run: chain(null, null) } };
  var emailOk = /^[a-z0-9._%+'-]+@karunya\.edu(?:\.in)?$/;
  window.LF_DEV = { as: as, switchAccount: function (e) { e = String(e || '').trim().toLowerCase(); if (!emailOk.test(e)) throw new Error('Enter an @karunya.edu or @karunya.edu.in email address.'); send({ type: 'switch', to: e }); }, signOut: function () { send({ type: 'switch', to: '' }); } };
  function position(ok, err) { ask('geo', {}, function (g) { if (g.denied) return err && err({ code: 1, message: 'User denied Geolocation' }); ok({ coords: { latitude: g.lat, longitude: g.lng, accuracy: g.accuracy }, timestamp: Date.now() }); }); }
  try { Object.defineProperty(navigator, 'geolocation', { configurable: true, value: { getCurrentPosition: position, watchPosition: function (ok, err) { position(ok, err); return 1; }, clearWatch: function () {} } }); } catch (e) { /* keep the real one */ }
  // Device keys: the app keeps them in IndexedDB. Here they live in the parent page instead (a CryptoKey survives
  // postMessage), so they work whatever storage a nested frame gets and survive the frame reloading.
  var fake = { open: function (name) {
    var req = {};
    setTimeout(function () {
      var db = { createObjectStore: function () {}, close: function () {}, transaction: function (store) {
        var tx = {}, ns = name + '/' + store;
        var op = function (kind, key, value) { var r = {}; ask('kv', { op: kind, ns: ns, key: key, value: value }, function (res) { r.result = res; if (tx.oncomplete) tx.oncomplete(); }); return r; };
        tx.objectStore = function () { return { get: function (k) { return op('get', k); }, put: function (v, k) { return op('put', k, v); }, delete: function (k) { return op('delete', k); } }; };
        return tx; } };
      req.result = db; if (req.onupgradeneeded) req.onupgradeneeded(); if (req.onsuccess) req.onsuccess();
    }, 0);
    return req; } };
  try { Object.defineProperty(window, 'indexedDB', { configurable: true, value: fake }); } catch (e) { /* the real one stays */ }
  document.addEventListener('DOMContentLoaded', function () {
    var LF = window.LF; if (!LF || !LF.util) return;
    var orig = LF.util.qrSvg;
    LF.util.qrSvg = function (text) { send({ type: 'qr', as: as, text: text }); return orig(text); };
  });
}
var frames = [];
function appFrame(as, title) {
  var el = h('iframe', { title: title });
  var f = { el: el, as: as, setAs: function (a) { f.as = a; var b = '<script>(' + bridge.toString() + ')(' + JSON.stringify(a) + ');<\/script>'; el.srcdoc = LFDATA.app.replace('<body>', function () { return '<body>' + b; }); if (f.onAs) f.onAs(a); } };
  frames.push(f); f.setAs(as); return f;
}
addEventListener('message', function (ev) {
  var d = ev.data || {}; if (d.lf !== 1) return;
  var f = frames.find(function (x) { return x.el.contentWindow === ev.source; });
