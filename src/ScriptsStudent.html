<script>
/* Student views + the device-bound signing key. The private key is a non-extractable WebCrypto ECDSA P-256 key kept in
   IndexedDB. "Non-extractable" means page script cannot read the key bytes; it is NOT claimed to be hardware-backed. */
(function () {
'use strict';
const LF = window.LF, h = LF.h, icon = LF.icon, api = LF.api, fmt = LF.fmt, ui = LF.ui, clear = LF.clear;

/* ------------------------------------------------------------------ device key */
const DB_NAME = 'labflow-device', STORE = 'keys';
function idb() { return new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error('IndexedDB is not available')); const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error || new Error('IndexedDB open failed')); r.onblocked = () => rej(new Error('IndexedDB blocked')); }); }
async function idbOp(mode, fn) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(STORE, mode), req = fn(tx.objectStore(STORE)); tx.oncomplete = () => { db.close(); res(req && req.result); }; tx.onerror = () => { db.close(); rej(tx.error); }; tx.onabort = () => { db.close(); rej(tx.error || new Error('aborted')); }; }); }
const idbGet = (k) => idbOp('readonly', (s) => s.get(k)), idbPut = (k, v) => idbOp('readwrite', (s) => s.put(v, k)), idbDel = (k) => idbOp('readwrite', (s) => s.delete(k));
const utf8 = (s) => new TextEncoder().encode(s);
const ALG = { name: 'ECDSA', namedCurve: 'P-256' }, SIG = { name: 'ECDSA', hash: 'SHA-256' };

const Device = LF.device = {
  keyName: () => 'device:' + (LF.me ? LF.me.email : ''),
  async load() { try { const r = await idbGet(Device.keyName()); return r && r.privateKey && r.credentialId ? r : null; } catch (e) { return null; } },
  /** Generate a key, prove possession to the server and keep the key only after the server accepted it. */
  async register(label) {
    if (!(window.crypto && crypto.subtle)) throw new LF.ApiError('UNSUPPORTED', 'This browser cannot create a secure device key (WebCrypto is unavailable).');
    // Fail early if this browser cannot keep the key: a registered device that cannot sign is worse than none.
    const probe = await Device.probeStorage(); if (!probe.ok) throw new LF.ApiError('UNSUPPORTED', 'This browser cannot store the device key (' + probe.why + '). Try the system browser (Chrome/Safari) instead of an in-app browser.');
    const pair = await crypto.subtle.generateKey(ALG, false, ['sign', 'verify']);
    const raw = await crypto.subtle.exportKey('raw', pair.publicKey);
    const begin = await api('cred.begin');
    const sig = await crypto.subtle.sign(SIG, pair.privateKey, utf8(begin.challenge));
    const out = await api('cred.complete', { challenge: begin.challenge, publicKey: LF.util.b64u(raw), signature: LF.util.b64u(sig), label: label || 'My phone', desktop: Device.isDesktop() });
    await idbPut(Device.keyName(), { credentialId: out.credentialId, privateKey: pair.privateKey, publicKey: LF.util.b64u(raw), label: label || 'My phone', createdAt: Date.now() });
    return out;
  },
  async sign(text) { const k = await Device.load(); if (!k) throw new LF.ApiError('NO_KEY', 'This phone does not hold your device key. Register this device first.'); return { credentialId: k.credentialId, signature: LF.util.b64u(await crypto.subtle.sign(SIG, k.privateKey, utf8(text))) }; },
  async forget() { try { await idbDel(Device.keyName()); } catch (e) { /* ignore */ } },
  /** Students are expected to register phones; a desktop registration is allowed but flagged for review. */
  isDesktop() { try { if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') return !navigator.userAgentData.mobile; } catch (e) { /* ignore */ } return !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || ''); },
  /** Can this browser sign with ECDSA P-256 and keep a CryptoKey across a read-back? */
  async probeStorage() {
    try {
      const pair = await crypto.subtle.generateKey(ALG, false, ['sign', 'verify']), name = 'probe:' + LF.util.uuid();
      await idbPut(name, { privateKey: pair.privateKey });
      const back = await idbGet(name); await idbDel(name);
      if (!back || !back.privateKey) return { ok: false, why: 'the key could not be read back' };
      const sig = await crypto.subtle.sign(SIG, back.privateKey, utf8('probe'));
      const ok = await crypto.subtle.verify(SIG, pair.publicKey, sig, utf8('probe'));
      return ok ? { ok: true } : { ok: false, why: 'a signature made with the stored key did not verify' };
    } catch (e) { return { ok: false, why: String(e && e.message || e).slice(0, 80) }; }
  },
  async diagnostics() {
    const rows = [];
    const add = (name, state, detail) => rows.push({ name, state, detail });
    add('Secure context', window.isSecureContext ? 'pass' : 'fail', window.isSecureContext ? 'HTTPS page' : 'WebCrypto needs HTTPS');
    const sub = !!(window.crypto && crypto.subtle);
    add('WebCrypto', sub ? 'pass' : 'fail', sub ? 'crypto.subtle is available' : 'Not available in this browser');
    if (sub) {
      try { const p = await crypto.subtle.generateKey(ALG, false, ['sign', 'verify']); const s = await crypto.subtle.sign(SIG, p.privateKey, utf8('x')); add('ECDSA P-256 signing', s.byteLength === 64 ? 'pass' : 'fail', s.byteLength === 64 ? 'Signature format is correct (64 bytes)' : 'Unexpected signature length ' + s.byteLength); }
      catch (e) { add('ECDSA P-256 signing', 'fail', String(e.message || e).slice(0, 90)); }
    }
    const st = await Device.probeStorage(); add('Key storage (IndexedDB)', st.ok ? 'pass' : 'fail', st.ok ? 'A non-extractable key survived a save and read-back' : 'Cannot keep the key: ' + st.why);
    try { const pers = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; add('Persistent storage', pers ? 'pass' : 'warn', pers ? 'The browser will not evict the key under storage pressure' : 'Not guaranteed: the browser may delete site data (for example Safari after about a week of non-use). If that happens, ask the lab desk to approve a new registration.'); } catch (e) { add('Persistent storage', 'warn', 'Could not be determined'); }
    add('Camera access', navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'pass' : 'warn', navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'Available (the phone camera app can also open the lab screen code)' : 'Not available here. Use your phone camera app to scan the lab screen.');
    add('Location', navigator.geolocation ? 'pass' : 'warn', navigator.geolocation ? 'This browser can share a location when you check in from the lab screen' : 'No location support: check-ins from the lab screen are marked "not available"');
    add('Screen brightness / wake lock', 'wake' in navigator || 'wakeLock' in navigator ? 'pass' : 'warn', 'wakeLock' in navigator ? 'The QR screen can keep the display on' : 'Raise your screen brightness manually when showing the QR');
    let has = null; try { has = await Device.load(); } catch (e) { /* ignore */ }
    add('Device key on this phone', has ? 'pass' : 'warn', has ? 'Registered as ' + has.credentialId : 'No key stored here yet');
    return rows;
  }
};


/* ------------------------------------------------------------------ helpers */
const stateBadge = (m) => m.state === 'in' ? ui.badge('Inside', 'good') : m.state === 'out' ? ui.badge('Left', '') : ui.badge('Not arrived', 'info');
function sessionTimes(s) { return fmt.time(s.scheduledStart) + ' - ' + fmt.time(s.scheduledEnd); }
const hasMode = (s, m) => String(s.labMode || 'A').indexOf(m) >= 0;
function deviceGate(me) {
  const st = me.student;
  if (!st) return null;
  if (st.status !== 'verified') return h('div', { class: 'card warn', role: 'status' }, h('div', { class: 't-h3' }, st.status === 'pending' ? 'Waiting for verification' : 'Profile not verified'), h('div', null, 'Show your ID card at the lab desk so staff can verify roll number ' + st.rollNo + '. You can check in once verified.'));
  return null;
}

/* ------------------------------------------------------------------ Version B: the rotating device-signed QR */
/**
 * The phone fetches a server nonce (valid qrTtlSeconds) and, every studentQrRotateSeconds, signs "token.timestamp" with
 * its non-extractable key and redraws the QR. The QR is a link, so a teacher's phone camera opens it directly. A
 * screenshot is refused after qrFreshSeconds; a new nonce is fetched before the old one runs out.
 */
function openQr(session, purpose, onDone) {
  let stopped = false, issued = null, rot = null, poll = null, refetch = null, wake = null;
  const qrBox = h('div', { class: 'qr-frame', 'aria-live': 'off' }), bar = h('div', { class: 'progress gold', style: { width: 'min(76vw, 340px)' } }, h('i', { style: { width: '100%' } }));
  const msg = h('div', { class: 'hint', role: 'status' }, 'Preparing your code...');
  const label = purpose === 'in' ? 'Check in' : purpose === 'out' ? 'Check out' : 'Confirm presence';
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => { wake = w; }).catch(() => {}); } catch (e) { /* optional */ }
  const body = h('div', { style: { display: 'grid', gap: '12px', justifyItems: 'center', textAlign: 'center' } },
    h('div', { class: 'hint' }, 'Show this to your teacher, the lab staff, your class rep or the lab scanner. It changes every few seconds, so a screenshot will not work.'), qrBox, bar, msg);
  const m = LF.modal(label + ': ' + (session.title || 'lab session'), body, { sticky: true, onClose: () => { stopped = true; clearInterval(rot); clearInterval(poll); clearTimeout(refetch); try { if (wake) wake.release(); } catch (e) { /* ignore */ } } });
  async function fetchNonce() {
    if (stopped) return;
    try {
      const k = await Device.load();
      if (!k) throw new LF.ApiError('NO_KEY', 'This phone has no device key. Open the Device tab and register it.');
      const ch = await api('attend.challenge', { sessionId: session.sessionId, purpose, credentialId: k.credentialId });
      if (stopped) return;
      issued = { ch, key: k }; msg.textContent = 'Live code. Keep this screen open.'; msg.className = 'hint';
      await draw();
      clearInterval(rot); rot = setInterval(draw, (ch.rotateSeconds || 3) * 1000);
      clearTimeout(refetch); refetch = setTimeout(fetchNonce, Math.max(10, (ch.ttl || 60) / 2) * 1000);
    } catch (e) {
      if (stopped) return;
      clearInterval(rot); clear(qrBox); msg.textContent = LF.errMsg(e); msg.className = 'err';
      if (e.code === 'RATE_LIMITED' || e.code === 'NETWORK' || e.code === 'BUSY') refetch = setTimeout(fetchNonce, 4000);
    }
  }
  async function draw() {
    if (stopped || !issued) return;
    const ts = Math.round(LF.now()), t = issued.ch.token + '.' + ts;
    const sig = LF.util.b64u(await crypto.subtle.sign(SIG, issued.key.privateKey, utf8(t)));
    const payload = issued.ch.token + '~' + ts + '~' + sig, link = (issued.ch.url || LF.me.webAppUrl || '') + (issued.ch.url && issued.ch.url.indexOf('?') >= 0 ? '&' : '?') + 's=' + payload;
    clear(qrBox).appendChild(LF.util.qrSvg(link));
    const rotate = (issued.ch.rotateSeconds || 3) * 1000, bi = bar.firstChild; bi.style.transition = 'none'; bi.style.width = '100%';
    requestAnimationFrame(() => { bi.style.transition = 'width ' + rotate + 'ms linear'; bi.style.width = '0%'; });
  }
  poll = setInterval(async () => {
    try {
      const r = await api('sessions.mine'); const cur = r.sessions.find((x) => x.sessionId === session.sessionId); if (!cur) return;
      const done = (purpose === 'in' && cur.mine.state === 'in') || (purpose === 'out' && cur.mine.state === 'out') || (purpose === 'rescan' && cur.mine.rescan && cur.mine.rescan.done);
      if (done) { stopped = true; clearInterval(poll); clearInterval(rot); clearTimeout(refetch); clear(qrBox).appendChild(h('div', { class: 'ok-big' }, icon('check'))); msg.textContent = 'Recorded at ' + fmt.time(LF.now()) + '. You can close this.'; msg.className = 'hint'; LF.toast(label + ' recorded', 'good'); if (onDone) onDone(); setTimeout(() => m.close(), 1800); }
    } catch (e) { /* transient; keep polling */ }
  }, 3500);
  fetchNonce();
}

/* ------------------------------------------------------------------ Version A: the kiosk QR + GPS check-in */
/** Read the phone's location once (high accuracy, no cached fix). Resolves null when it is not available. */
function readLocation(onStatus) {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { onStatus('This browser cannot share a location.'); return resolve(null); }
    let best = null, done = false;
    const finish = () => { if (done) return; done = true; try { navigator.geolocation.clearWatch(id); } catch (e) { /* ignore */ } resolve(best); };
    const id = navigator.geolocation.watchPosition((p) => {
      const c = p.coords; if (!best || c.accuracy < best.accuracy) best = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy };
      onStatus('Location found, accurate to about ' + Math.round(best.accuracy) + ' m' + (best.accuracy > 25 ? '. Improving...' : '.'));
      if (best.accuracy <= 20) setTimeout(finish, 400);
    }, (err) => { onStatus(err.code === 1 ? 'Location permission was refused.' : 'Could not get a location fix.'); finish(); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    setTimeout(finish, 12000);
  });
}

/**
 * The student scanned the code on the lab screen with the phone camera (the link opened LABFLOW with ?k=...), or
 * used "Scan the lab screen" inside the app. The code is checked the moment the page opens; the student then has a
 * couple of minutes to choose what they are here for and send one location reading.
 */
/** Availability is a snapshot; the server rechecks these choices under the write lock. */
function workPicker(choices, required, current, exactAsset) {
  choices = choices || { projects: [], systems: [], bookedAssetIds: [] }; current = current || {};
  const booked = exactAsset ? [exactAsset] : choices.bookedAssetIds;
  const project = ui.field({ name: 'projectId', label: required ? 'Project' : 'Project (optional)', type: 'select', required,
    value: current.projectId || (choices.projects.length === 1 ? choices.projects[0].projectId : ''),
    options: [{ value: '', label: required ? 'Choose a project' : 'No project' }].concat(choices.projects.map((p) => ({ value: p.projectId, label: p.title + (p.status === 'pending' ? ' (pending approval)' : '') }))) });
  const system = ui.field({ name: 'assetId', label: 'System', type: 'select', value: exactAsset || (booked.length && !booked.includes(current.assetId) ? booked[0] : current.assetId) || '',
    options: [{ value: '', label: 'Own laptop / no system' }].concat(choices.systems.map((s) => ({ value: s.assetId, label: s.name + (s.assetTag ? ' · ' + s.assetTag : '') + (s.status !== 'free' ? ' (' + s.status + ')' : '') }))) });
  Array.from(system.input.options).forEach((o) => {
    const s = choices.systems.find((s) => s.assetId === o.value);
    o.disabled = (!!o.value && (!s || s.status !== 'free')) || (booked.length > 0 && !booked.includes(o.value));
  });
  [project, system].forEach((field) => { field.el.style.minWidth = '0'; field.input.style.minWidth = '0'; field.input.style.maxWidth = '100%'; });
  const el = h('section', { 'aria-label': 'Project and system', style: { display: 'grid', gap: '12px', minWidth: 0 } }, project.el, system.el,
    required && !choices.projects.length ? h('p', { class: 'hint err' }, 'Create a pending or active project for this lab under My projects, then return to check in.') : null,
    booked.length ? h('p', { class: 'hint' }, 'Your current workstation booking requires its booked system.') : null);
  return { el, get: () => ({ projectId: project.get(), assetId: system.get() }), freeze: (yes) => { project.input.disabled = yes; system.input.disabled = yes; },
    valid: () => { if (required && !project.get()) { project.input.reportValidity(); return false; } return true; } };
}

function editWork(session, reload) {
  const current = session.mine.work;
  if (!current) return;
  const picker = workPicker(session.workChoices, session.type === 'openlab', current);
  const error = h('div', { class: 'err', role: 'alert', hidden: true });
  let modal, pending = null, uncertain = false;
  const eventId = 'EVT-' + LF.util.uuid().replace(/-/g, '').slice(0, 12).toUpperCase();
  const save = ui.button('Save project and system', { kind: 'primary', onClick: async () => {
    error.hidden = true;
    if (!pending) {
      if (!picker.valid()) return;
      pending = Object.assign({ sessionId: session.sessionId, entryEventId: current.entryEventId, expectedEventId: current.eventId, eventId }, picker.get());
    }
    picker.freeze(true);
    try { await api('attend.setWork', pending); modal.close(); LF.toast('Project and system saved.', 'good'); reload(); }
    catch (e) {
      uncertain = uncertain || ['NETWORK', 'INTERNAL', 'IN_PROGRESS'].includes(e.code);
      error.textContent = LF.errMsg(e) + (uncertain ? ' Retry to confirm the same saved request. Your original choices are preserved.' : ''); error.hidden = false;
      if (!uncertain) { pending = null; picker.freeze(false); }
    }
  } });
  const refresh = ui.button('Refresh choices', { onClick: async () => {
    const result = await api('sessions.mine'); const fresh = result.sessions.find((s) => s.sessionId === session.sessionId);
    modal.close(); if (fresh && fresh.mine.state === 'in') editWork(fresh, reload); else { LF.toast('This visit has ended.'); reload(); }
  } });
  modal = LF.modal('Change system / project', h('div', { style: { display: 'grid', gap: '12px' } },
    h('p', { class: 'hint' }, 'Changes apply to this visit. They do not add attendance time.'), picker.el, error, h('div', { class: 'toolbar' }, save, refresh)), { sticky: true });
}

LF.kioskCheckin = (code) => {
  const body = h('div', { style: { display: 'grid', gap: '12px' } }, ui.skeleton(3));
  let timer = null, stopped = false;
  const m = LF.modal('Lab check-in', body, { sticky: true, onClose: () => { stopped = true; clearInterval(timer); } });
  (async () => {
    let op;
    try { op = await api('checkin.open', { code }); }
    catch (e) { clear(body).append(LF.ui.scanError(e), h('p', { class: 'hint' }, e.code === 'CODE_EXPIRED' || e.code === 'REPLAY' ? 'Scan the code that is on the lab screen right now.' : 'Ask the lab staff if this keeps happening.'), ui.button('Close', { onClick: () => m.close() })); return; }
    const left = h('span', { class: 't-data' }), pass = h('div', { class: 'toolbar', style: { justifyContent: 'space-between' } }, h('div', null, h('div', { class: 't-h3' }, op.lab.name), h('div', { class: 'hint' }, op.lab.code + (op.lab.hasGeofence ? ' · within ' + op.lab.radiusM + ' m of the lab' : ''))), h('span', { class: 'badge info' }, 'Time left ', left));
    const tick = () => { const ms = op.passExpiresAt - LF.now(); left.textContent = fmt.countdown(ms); if (ms <= 0) { clearInterval(timer); clear(body).append(LF.ui.scanError(new LF.ApiError('PASS_EXPIRED', 'Time is up. Scan the code on the lab screen again.')), ui.button('Close', { onClick: () => m.close() })); } };
    tick(); timer = setInterval(tick, 500);
    const status = h('div', { class: 'hint', role: 'status' }), err = h('div', { role: 'alert' });
    let action = op.actions[0], choice = op.prefill, picker = null, selections = {}, uncertain = false;
    const actLabel = { in: 'Check in', out: 'Check out', rescan: 'Confirm I am still here' };
    const actions = op.actions.length > 1 ? h('div', { class: 'choice', role: 'radiogroup', 'aria-label': 'What do you want to do?' }, op.actions.map((a) => h('label', null, h('input', { type: 'radio', name: 'kc-act', value: a, checked: a === action, onchange: () => { action = a; draw(); } }), h('span', null, h('strong', null, actLabel[a]), a === 'out' && op.inside ? h('div', { class: 'hint' }, op.inside.title + (op.inside.closed ? ' (session closed, exit still accepted)' : '')) : null)))) : null;
    const reasonText = { 'class': 'Regular lab course', event: 'Event or workshop', research: 'Individual research', openlab: 'Walk-in open lab' };
    const sessionsBox = h('div');
    function draw() {
      if (picker) selections = picker.get(); picker = null;
      clear(sessionsBox);
      if (action !== 'in') { if (op.inside) sessionsBox.append(h('div', { class: 'row' }, h('span', null, h('strong', null, op.inside.title), h('span', { class: 'hint' }, ' · inside since ' + fmt.time(op.inside.since))), ui.badge('inside', 'good'))); return; }
      if (!op.candidates.length) { sessionsBox.append(ui.empty('Nothing to check in to', 'No eligible session is open here now. Open lab appears during its enabled opening hours. A workstation booking or approved research visit can offer other choices.')); return; }
      sessionsBox.append(h('div', { class: 't-label', style: { marginBottom: '6px' } }, 'What are you here for?'), h('div', { class: 'choice', role: 'radiogroup', 'aria-label': 'Entry reason' }, op.candidates.map((c) => {
        const id = c.sessionId || c.reservationId;
        return h('label', { class: c.eligible ? '' : 'disabled' }, h('input', { type: 'radio', name: 'kc-ses', value: id, checked: id === choice, disabled: !c.eligible, onchange: () => { choice = id; draw(); } }),
          h('span', null, h('strong', null, c.title), h('div', { class: 'hint' }, reasonText[c.reason] + ' · ' + fmt.time(c.scheduledStart) + ' - ' + fmt.time(c.scheduledEnd) + (c.eligible ? '' : ' · you are not on this roster'))));
      })));
      const candidate = op.candidates.find((c) => (c.sessionId || c.reservationId) === choice);
      if (candidate && (candidate.reason === 'openlab' || (op.workChoices && op.workChoices.bookedAssetIds.length))) {
        picker = workPicker(op.workChoices, candidate.reason === 'openlab', selections, candidate.assetId); sessionsBox.append(picker.el);
      }
    }
    draw();
    const go = ui.button('Send location and ' + (op.actions[0] === 'in' ? 'check in' : 'continue'), { kind: 'primary', block: true, icon: 'pin', onClick: async () => {
      clear(err);
      if (uncertain) { m.close(); LF.go('today'); return; }
      if (action === 'in' && !choice) { err.append(h('div', { class: 'err' }, 'Choose what you are here for.')); return; }
      if (picker && !picker.valid()) return;
      const work = picker ? picker.get() : {};
      const controls = Array.from(body.querySelectorAll('input,select,textarea')).map((input) => ({ input, disabled: input.disabled }));
      controls.forEach((x) => { x.input.disabled = true; });
      const unlock = () => controls.forEach((x) => { x.input.disabled = x.disabled; });
      status.textContent = 'Getting your location...';
      const geo = await readLocation((t) => { status.textContent = t; });
      if (stopped) return;
      if (!geo && op.geoUnavailablePolicy === 'reject') { unlock(); err.append(h('div', { class: 'err' }, 'LABFLOW needs your location to check you in. Allow location for this page and try again.')); return; }
      const c = op.candidates.find((x) => (x.sessionId || x.reservationId) === choice) || {};
      try {
        const r = await api('checkin.submit', { pass: op.pass, action, sessionId: action === 'in' ? c.sessionId || undefined : (op.inside ? op.inside.sessionId : undefined), reservationId: action === 'in' ? c.reservationId || undefined : undefined, reason: action === 'in' ? c.reason : undefined, geo: geo || undefined, ...work });
        clearInterval(timer);
        clear(body).append(h('div', { style: { display: 'grid', justifyItems: 'center', gap: '10px', textAlign: 'center' } }, h('div', { class: 'ok-big' }, icon('check')), h('div', { class: 't-h2' }, LF.SCAN_LABEL[r.type] || r.type),
          h('div', null, r.session.title + ' · ' + fmt.time(r.at)), r.assurance === 'flagged' ? h('div', { class: 'card bad', role: 'alert' }, r.geofence === 'fail' ? 'Recorded, but your phone places you outside the lab. Your teacher will review this check-in; until then it does not count as present.' : 'Recorded, but your location looked impossible for a phone. Your teacher will review this check-in.')
            : r.geofence === 'na' ? h('div', { class: 'card warn' }, 'Recorded without a location check. Your faculty may verify you in person.') : h('div', { class: 'hint' }, 'Location check passed.'),
          ui.button('Done', { kind: 'primary', onClick: () => { m.close(); if (LF.current && LF.current.id === 'today') LF.go('today'); } })));
      } catch (e) {
        status.textContent = '';
        err.append(LF.ui.scanError(e));
        uncertain = ['NETWORK', 'INTERNAL'].includes(e.code);
        if (uncertain) { clearInterval(timer); go.textContent = 'Refresh sessions to confirm'; }
        else unlock();
        if (e.code === 'PASS_EXPIRED' || e.code === 'REPLAY') { clearInterval(timer); go.disabled = true; }
      }
    } });
    clear(body).append(pass, op.consentRequired ? LF.privacyNotice() : null, actions, sessionsBox, h('p', { class: 'hint', style: { margin: 0 } }, 'Your phone sends its location once. LABFLOW keeps only whether you were inside the lab and how far away, never your coordinates.'), status, err, go);
  })();
};

/** In-app camera / paste for the kiosk code, when the phone camera app is not convenient. */

/* Tier 1: while the page is open after check-in, report the location at random times the server picks. A hidden page
