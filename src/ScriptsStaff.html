<script>
/* Lab staff views: desk queues, issue/return, inventory, bookings, people & device approvals, reports. Also reused by admins. */
(function () {
'use strict';
const LF = window.LF, h = LF.h, api = LF.api, fmt = LF.fmt, ui = LF.ui, clear = LF.clear;
const CONDITIONS = ['good', 'fair', 'poor', 'damaged'];
const isAdmin = () => LF.me.roles.includes('admin');
const opt = (list, v, l) => list.map((x) => ({ value: x[v], label: typeof l === 'function' ? l(x) : x[l] }));
const meta = {}; // labs / categories cache for the current view
async function loadMeta() {
  const [labs, cats] = await Promise.all([api('labs.list', { includeInactive: true }), api('categories.list')]);
  meta.labs = labs.labs; meta.cats = cats.categories;
  meta.labName = (id) => (meta.labs.find((l) => l.labId === id) || {}).name || id; meta.catName = (id) => (meta.cats.find((c) => c.categoryId === id) || {}).name || id;
  return meta;
}

/** Searchable student picker. onPick(student). */
function studentPicker(label, onPick, opts) {
  opts = opts || {};
  let searchVersion = 0;
  const out = h('div', { class: 'hint', 'aria-live': 'polite' }), chosen = h('div'), list = h('div', { style: { display: 'grid', gap: '6px' } });
  const input = h('input', { class: 'input', type: 'search', 'aria-label': label, placeholder: 'Roll number or name', oninput: LF.util.debounce(async (e) => {
    const version = searchVersion, q = e.target.value.trim(); clear(list); if (q.length < 2) { out.textContent = 'Type at least 2 characters.'; return; }
    out.textContent = 'Searching...';
    try {
      const r = await api('students.list', { q, limit: 8, status: opts.status });
      if (version !== searchVersion) return;
      out.textContent = r.students.length ? '' : 'No student found.';
      r.students.forEach((s) => list.appendChild(h('button', { type: 'button', class: 'row', style: { textAlign: 'left', cursor: 'pointer' }, onclick: () => { clear(list); out.textContent = ''; input.value = ''; setChosen(s); onPick(s); } }, h('span', null, h('strong', null, s.rollNo), ' ' + s.name), ui.status(s.status))));
    } catch (x) { if (version === searchVersion) out.textContent = LF.errMsg(x); }
  }, 250) });
  input.addEventListener('input', () => { searchVersion++; clear(list); });
  function setChosen(s) { searchVersion++; clear(list); out.textContent = ''; clear(chosen).append(h('div', { class: 'row' }, h('span', null, h('strong', null, s.rollNo), ' ' + s.name), h('span', { class: 'toolbar' }, ui.status(s.status), h('button', { class: 'btn btn-sm', type: 'button', onclick: () => { searchVersion++; clear(chosen); onPick(null); } }, 'Change')))); }
  return { el: h('div', { class: 'field' }, h('label', null, label), input, out, list, chosen), set: setChosen };
}

/** Student photo + devices dialog (identity checks at the desk). */
function showStudent(s, reload) {
  const body = h('div', { style: { display: 'grid', gap: '12px' } }, ui.skeleton(3)); const m = LF.modal(s.name + ' · ' + s.rollNo, body, { wide: true });
  (async () => {
    try {
      const [creds, photo] = await Promise.all([api('cred.list', { studentId: s.studentId }), s.hasPhoto ? api('photo.get', { studentId: s.studentId }).catch(() => ({ dataUrl: null })) : Promise.resolve({ dataUrl: null })]);
      const file = h('input', { type: 'file', accept: 'image/*', capture: 'user', class: 'input', 'aria-label': 'Take or upload a reference photo', onchange: async (e) => { try { await api('photo.set', { studentId: s.studentId, photo: await LF.util.photoFromFile(e.target.files[0]) }); LF.toast('Photo saved', 'good'); m.close(); if (reload) reload(); } catch (x) { LF.fail(x); } } });
      clear(body).append(h('div', { style: { display: 'flex', gap: '16px', flexWrap: 'wrap' } }, photo.dataUrl ? h('img', { class: 'photo', src: photo.dataUrl, alt: 'Reference photo of ' + s.name }) : h('div', { class: 'photo', style: { display: 'grid', placeItems: 'center' } }, 'No photo'),
        h('dl', { class: 'dl' }, ...[['Email', s.email || '-'], ['Dept / section', s.department + ' / ' + (s.section || '-')], ['Year', s.year || '-'], ['Profile', s.status]].flatMap(([k, v]) => [h('dt', null, k), h('dd', null, String(v))]))),
        h('div', { class: 'field' }, h('label', null, 'Reference photo'), file),
        h('h3', { class: 't-h3' }, 'Devices'),
        creds.credentials.length ? h('div', { style: { display: 'grid', gap: '8px' } }, creds.credentials.map((c) => h('div', { class: 'row' }, h('div', null, h('strong', null, c.label), h('div', { class: 'hint' }, 'Registered ' + fmt.dt(c.createdAt) + (c.revokeReason ? ' · ' + c.revokeReason : ''))), h('div', { class: 'toolbar' }, ui.status(c.status),
          c.status === 'active' || c.status === 'pending_approval' ? ui.button('Revoke', { size: 'sm', kind: 'danger', onClick: async () => { if (!await LF.confirm({ title: 'Revoke device?', message: 'The phone stops working at the kiosk immediately.', confirmLabel: 'Revoke', danger: true })) return; await api('cred.revoke', { credentialId: c.credentialId, reason: 'revoked by staff' }); LF.toast('Revoked', 'good'); m.close(); } }) : null)))) : h('div', { class: 'hint' }, 'No devices registered.'),
        isAdmin() && s.email ? ui.button('Unlink account (wrong account claimed this profile)', { kind: 'danger', onClick: () => { m.close(); LF.ui.formModal({ title: 'Unlink ' + s.rollNo, intro: 'Detaches the Google account and revokes all devices. The roll number can then be claimed again.', fields: [{ name: 'reason', label: 'Reason', type: 'textarea', rows: 2, required: true, maxlength: 200 }], submitLabel: 'Unlink', onSubmit: async (v) => { await api('students.unlink', { studentId: s.studentId, reason: v.reason }); LF.toast('Unlinked', 'good'); if (reload) reload(); } }); } }) : null);
    } catch (e) { clear(body).append(ui.errorBox(e)); }
  })();
}
LF.showStudent = showStudent;

/* ------------------------------------------------------------------ Desk (queues) */
LF.register({ role: 'staff', id: 'queue', label: 'Desk', icon: 'home', render(root) {
  const stats = h('div', { class: 'grid-stats' }), body = h('div', { style: { display: 'grid', gap: '20px' } }), feed = h('div', { class: 'feed', 'aria-live': 'polite' });
  root.append(h('h1', { class: 't-h1' }, 'Lab desk'), h('h2', { class: 't-h2' }, 'Live occupancy'), ui.occupancy(), stats, h('div', { class: 'split' }, body, h('section', { class: 'card', 'aria-label': 'Live activity' }, h('h2', { class: 't-h2' }, 'Live activity'), h('p', { class: 'hint' }, 'Latest check-ins and equipment movements across labs.'), feed)));
  const loadFeed = async () => {
    try {
      const r = await api('activity.feed');
      clear(feed).append(...(r.items.length ? r.items.map((x) => h('div', { class: 'row' }, h('span', null, x.kind === 'scan' ? [h('strong', null, x.name || '-'), ' ' + (x.rollNo || '') + ' · ' + (LF.SCAN_LABEL[x.type] || x.type.replace('CORR_', 'manual ').toLowerCase())] : [h('strong', null, x.name || '-'), ' · ' + x.type + ' ' + Math.abs(x.qty || 0)]),
        h('span', { class: 'toolbar' }, x.labCode ? ui.badge(x.labCode, '') : null, x.method ? ui.badge(x.method === 'scanner' ? 'phone scan' : x.method, x.assurance === 'lower' ? 'warn' : '') : null, h('span', { class: 'hint t-data' }, fmt.time(x.at))))) : [h('div', { class: 'hint' }, 'Nothing yet today.')]));
    } catch (e) { /* the feed is informational */ }
  };
  const reload = () => { ui.loadInto(stats, async () => {
    const d = await api('dash.staff');
    return h('div', { class: 'grid-stats' }, ui.stat('Equipment requests', d.pendingEquipment, 'From students inside a lab', d.pendingEquipment ? 'warn' : ''), ui.stat('Students to verify', d.pendingStudents, null, d.pendingStudents ? 'warn' : ''), ui.stat('Device requests', d.pendingCredentials, null, d.pendingCredentials ? 'warn' : ''), ui.stat('Booking requests', d.pendingBookings, null, d.pendingBookings ? 'warn' : ''),
      ui.stat('Loans out', d.activeLoans), ui.stat('Overdue', d.overdueLoans, null, d.overdueLoans ? 'bad' : ''), ui.stat('Open flags', d.openFlags, null, d.openFlags ? 'warn' : ''), ui.stat('Damaged / missing', d.damaged + ' / ' + d.missing, null, d.damaged + d.missing ? 'warn' : ''));
  }, 1); ui.loadInto(body, async () => {
    const [eq, pc, ps, pb, ov] = await Promise.all([api('equipment.list', { status: 'pending' }), api('cred.pending'), api('students.list', { status: 'pending', limit: 50 }), api('booking.list', { status: 'pending' }), api('loans.list', { status: 'overdue' })]);
    return h('div', { style: { display: 'grid', gap: '20px' } },
      section('Equipment requests', 'Students who are checked in asked for these. Hand them over on the issue screen; the request closes with the loan.', eq.requests.length ? eq.requests.map((q) => h('div', { class: 'row' }, h('div', null, h('strong', null, q.name), ' ' + q.rollNo + ' wants ' + q.resourceName + ' × ' + q.quantity, h('div', { class: 'hint' }, q.labName + ' · ' + fmt.time(q.requestedAt) + (q.note ? ' · ' + q.note : ''))),
        h('div', { class: 'toolbar' }, ui.button('Issue', { kind: 'primary', size: 'sm', onClick: () => { LF.sel = LF.sel || {}; LF.sel.request = q; LF.go('desk'); } }), ui.button('Cannot fill', { size: 'sm', onClick: () => LF.ui.formModal({ title: 'Cannot fill this request', fields: [{ name: 'note', label: 'Reason (shown to the student)', required: true, maxlength: 200 }], submitLabel: 'Send', onSubmit: async (v) => { await api('equipment.decide', { requestId: q.requestId, note: v.note }); reload(); } }) })))) : null),
      section('Device replacement requests', 'Check the student\'s ID card in person before approving. The old device stops working at once.', pc.pending.length ? pc.pending.map((c) => h('div', { class: 'row' }, h('div', null, h('strong', null, c.studentName), ' ' + c.rollNo, h('div', { class: 'hint' }, c.label + ' · requested ' + fmt.dt(c.createdAt))),
        h('div', { class: 'toolbar' }, ui.button('Approve', { kind: 'primary', size: 'sm', onClick: () => LF.ui.formModal({ title: 'Approve new device for ' + c.studentName, fields: [{ name: 'idChecked', label: 'I have checked the student\'s ID card in person', type: 'checkbox' }], submitLabel: 'Approve device', onSubmit: async (v) => { if (!v.idChecked) throw new LF.ApiError('BAD_INPUT', 'Confirm the ID check first.'); await api('cred.approve', { credentialId: c.credentialId, idChecked: true }); LF.toast('Device approved', 'good'); reload(); } }) }),
          ui.button('Reject', { size: 'sm', onClick: () => LF.ui.formModal({ title: 'Reject device request', fields: [{ name: 'reason', label: 'Reason', required: true, maxlength: 200 }], submitLabel: 'Reject', onSubmit: async (v) => { await api('cred.reject', { credentialId: c.credentialId, reason: v.reason }); reload(); } }) })))) : null),
      section('Students awaiting verification', 'Match the roll number to the ID card, then verify.', ps.students.length ? ps.students.map((s) => h('div', { class: 'row' }, h('div', null, h('strong', null, s.rollNo), ' ' + s.name, h('div', { class: 'hint' }, s.email + ' · ' + s.department + ' ' + (s.section || ''))),
        h('div', { class: 'toolbar' }, ui.button('Details', { size: 'sm', onClick: () => showStudent(s, reload) }), ui.button('Verify', { size: 'sm', kind: 'primary', onClick: async () => { await api('students.verify', { studentId: s.studentId, approve: true }); LF.toast('Verified', 'good'); reload(); } }),
          ui.button('Reject', { size: 'sm', onClick: () => LF.ui.formModal({ title: 'Reject ' + s.rollNo, fields: [{ name: 'note', label: 'Note for the student', maxlength: 200 }], submitLabel: 'Reject', onSubmit: async (v) => { await api('students.verify', { studentId: s.studentId, approve: false, note: v.note }); reload(); } }) })))) : null),
      section('Booking requests', null, pb.reservations.length ? pb.reservations.map((b) => bookingRow(b, reload)) : null),
      section('Overdue loans', null, ov.loans.length ? ov.loans.map((l) => h('div', { class: 'row' }, h('div', null, h('strong', null, l.borrowerName), h('div', { class: 'hint' }, 'Due ' + fmt.dt(l.dueAt))), ui.button('Open return', { size: 'sm', onClick: () => { LF.sel = LF.sel || {}; LF.sel.loanId = l.loanId; LF.go('desk'); } }))) : null));
  }); };
  loadMeta().then(reload).catch(reload);
  loadFeed(); LF.every(8000, loadFeed);
  LF.every(30000, () => { if (!document.querySelector('.modal-back')) reload(); });
  function section(title, lead, rows) { return h('section', { 'aria-label': title }, h('h2', { class: 't-h2' }, title), lead ? h('p', { class: 'hint' }, lead) : null, rows ? h('div', { style: { display: 'grid', gap: '8px', marginTop: '8px' } }, rows) : h('div', { class: 'hint', style: { marginTop: '6px' } }, 'Nothing waiting.')); }
} });

function bookingRow(b, reload) {
  return h('div', { class: 'row' }, h('div', null, h('strong', null, b.requesterName), ' wants ' + b.resourceName + ' × ' + b.quantity, h('div', { class: 'hint' }, fmt.dt(b.startAt) + ' → ' + fmt.dt(b.endAt) + ' · ' + b.purpose)),
    b.status === 'pending' ? h('div', { class: 'toolbar' }, ui.button('Approve', { size: 'sm', kind: 'primary', onClick: async () => { await api('booking.decide', { reservationId: b.reservationId, approve: true }); LF.toast('Approved', 'good'); reload(); } }),
      ui.button('Reject', { size: 'sm', onClick: () => LF.ui.formModal({ title: 'Reject booking', fields: [{ name: 'note', label: 'Reason', required: true, maxlength: 200 }], submitLabel: 'Reject', onSubmit: async (v) => { await api('booking.decide', { reservationId: b.reservationId, approve: false, note: v.note }); reload(); } }) })) : ui.status(b.status));
}

/* ------------------------------------------------------------------ Issue / Return */
LF.register({ role: 'staff', id: 'desk', label: 'Issue / Return', icon: 'scan', render(root) {
  const wanted = LF.sel && LF.sel.loanId; if (LF.sel) LF.sel.loanId = null;
  const request = LF.sel && LF.sel.request; if (LF.sel) LF.sel.request = null;
  root.append(h('h1', { class: 't-h1' }, 'Issue & return'), h('div', { id: 'desk-body' }));
  const body = root.querySelector('#desk-body');
  ui.loadInto(body, async () => { await loadMeta(); return ui.tabs([
    { id: 'issue', label: 'Issue', render: (p) => { p.appendChild(issueForm()); } },
    { id: 'return', label: 'Return', render: (p) => { p.appendChild(returnView(wanted)); } },
    { id: 'all', label: 'All loans', render: (p) => { ui.loadInto(p, allLoans); } }], wanted ? 'return' : 'issue'); });

  function issueForm() {
    const root = h('div', { class: 'split' });
    let idem = LF.util.uuid(), borrower = null, group = null, lines = []; // lines: { assetId, qty, name }
    const lab = ui.field({ name: 'lab', label: 'Lab', type: 'select', required: true, options: opt(meta.labs.filter((l) => l.status === 'active'), 'labId', 'name') });
    const kind = ui.field({ name: 'kind', label: 'Issue to', type: 'select', options: [{ value: 'student', label: 'A student' }, { value: 'group', label: 'A project group' }] });
    const days = ui.field({ name: 'days', label: 'Loan period (days)', type: 'number', min: 1, max: 120, value: LF.me.settings.loanDefaultDays });
    const notes = ui.field({ name: 'notes', label: 'Notes', maxlength: 300 });
    const who = h('div'), bookingBox = h('div'), kitBox = h('div'), itemBox = h('div'), cart = h('div'), msg = h('div', { class: 'err', role: 'alert', hidden: true }), result = h('div', { role: 'status' });
    let kitId = '', kitPicks = [], reservationId = '', selectedBooking = null, requestId = request ? request.requestId : '';
    const bookingInfo = h('section', { class: 'notice', 'aria-label': 'Booking collection details', hidden: true });
    let whoVersion = 0, bookingVersion = 0, kitVersion = 0, componentVersion = 0;
    const knownAssets = new Map(), knownKits = new Map();
    const checklist = h('section', { class: 'notice', 'aria-label': 'Issue checklist', 'aria-live': 'polite' });
    let kitsLoading = true, componentsLoading = false, componentError = '';
    let pendingSubmission = null, mustRetry = false, formFrozen = false;
    const frozenControls = new Map();
    function freezeIssue(value) {
      if (value && !formFrozen) root.querySelectorAll('input, select, textarea, button').forEach((control) => { frozenControls.set(control, control.disabled); control.disabled = true; });
      if (!value) { frozenControls.forEach((disabled, control) => { control.disabled = disabled; }); frozenControls.clear(); }
      [who, bookingBox, kitBox, itemBox, cart].forEach((box) => { box.inert = value; });
      formFrozen = value;
    }
    const requestCard = request ? h('div', { class: 'card sky' }, h('strong', null, 'Filling a request: '), request.name + ' (' + request.rollNo + ') asked for ' + request.resourceName + ' × ' + request.quantity + '.') : null;
    function clearRequest() { requestId = ''; if (requestCard) requestCard.hidden = true; refreshChecklist(); }
    function rememberAssets(assets) { assets.forEach((a) => knownAssets.set(a.assetId, a)); }
    function refreshChecklist() {
      const errors = [], rows = [], byAsset = new Map(), byCategory = new Map(), required = new Map();
      const selected = lines.concat(kitPicks);
      selected.forEach((ln) => {
        const a = knownAssets.get(ln.assetId);
        if (!a) { errors.push('Choose an available item.'); return; }
        if (!Number.isSafeInteger(ln.qty) || ln.qty < 1) { errors.push(a.name + ': enter a whole quantity of at least 1.'); return; }
        byAsset.set(a.assetId, (byAsset.get(a.assetId) || 0) + ln.qty);
        byCategory.set(a.categoryId, (byCategory.get(a.categoryId) || 0) + ln.qty);
      });
      byAsset.forEach((qty, id) => {
        const a = knownAssets.get(id), tooMany = qty > a.quantityAvailable || (a.trackingMode === 'individual' && qty !== 1);
        if (tooMany) errors.push(a.name + ': only ' + a.quantityAvailable + ' available; ' + qty + ' selected.');
        rows.push(h('li', { class: tooMany ? 'err' : 'hint' }, a.name + ': ' + qty + ' selected · ' + a.quantityAvailable + ' available when selected'));
      });
      if (byAsset.size > 80) errors.push('A loan can contain at most 80 different items. Split this issue into smaller loans.');
      function requirement(label, categoryId, needed, count) {
        required.set(categoryId, Math.max(required.get(categoryId) || 0, needed));
        const missing = Math.max(0, needed - count);
        rows.push(h('li', { class: 'hint' }, label + ': ' + count + ' / ' + needed + ' selected ', ui.badge(missing ? 'Missing ' + missing : 'Ready', missing ? 'warn' : 'good')));
        if (missing) errors.push(label + ': select ' + missing + ' more.');
      }
      if (kitId) {
        const kit = knownKits.get(kitId);
        if (componentError) errors.push(componentError);
        else if (componentsLoading || !kit) errors.push('Wait for the kit components to finish loading.');
        else kit.components.forEach((c) => requirement('Kit · ' + meta.catName(c.categoryId), c.categoryId, c.quantity,
          kitPicks.filter((p) => p.componentId === c.componentId).reduce((sum, p) => sum + p.qty, 0)));
      }
      function targetRequirements(target, label) {
        if (target.resourceType === 'category') requirement(label + ' · ' + target.resourceName, target.resourceId, target.quantity, byCategory.get(target.resourceId) || 0);
        else if (target.resourceType === 'asset') {
          const count = byAsset.get(target.resourceId) || 0, a = knownAssets.get(target.resourceId);
          if (a) required.set(a.categoryId, Math.max(required.get(a.categoryId) || 0, 1));
          rows.push(h('li', { class: 'hint' }, label + ' · ' + target.resourceName + ': ' + count + ' / 1 selected ', ui.badge(count === 1 ? 'Ready' : 'Choose reserved item', count === 1 ? 'good' : 'warn')));
          if (count !== 1) errors.push('Choose the specific reserved item: ' + target.resourceName + '.');
        }
        else {
          const kit = knownKits.get(target.resourceId);
          if (kitsLoading) errors.push('Wait for the kit details to load.');
          else if (!kit || kit.status !== 'active') errors.push('The selected kit is no longer available.');
          else kit.components.forEach((c) => requirement(label + ' · ' + meta.catName(c.categoryId), c.categoryId, c.quantity * target.quantity, byCategory.get(c.categoryId) || 0));
        }
      }
      if (requestId) targetRequirements(request, 'Request');
      if (selectedBooking) {
        targetRequirements(selectedBooking, 'Booking');
        if (!Number.isFinite(selectedBooking.collectionOpensAt)) errors.push('Collection timing is unavailable. Reload the booking before issuing.');
        else if (LF.now() < selectedBooking.collectionOpensAt) errors.push('This booking cannot be collected until ' + fmt.dt(selectedBooking.collectionOpensAt) + '.');
        if (LF.now() > selectedBooking.endAt) errors.push('This booking has ended. Choose another booking or issue directly.');
      }
      if (required.size) byCategory.forEach((qty, id) => {
        const extra = qty - (required.get(id) || 0);
        if (extra > 0) rows.push(h('li', { class: 'hint' }, ui.badge('Extra ' + extra, 'warn'), ' ' + meta.catName(id) + ' beyond the requested components.'));
      });
      if (!selected.length) errors.push('Select equipment or choose the kit components to issue.');
      clear(checklist).append(h('h3', { class: 't-h3' }, 'Before you issue'),
        rows.length ? h('ul', { style: { margin: '8px 0', paddingLeft: '20px', display: 'grid', gap: '6px' } }, rows) : h('p', { class: 'hint' }, 'Add equipment to see quantities and availability.'),
        h('div', { class: 'hint' }, errors.length ? errors[0] : 'Selection ready. Availability is checked again when you issue.'));
      return errors;
    }
    if (request) lab.input.value = request.labId;
    function drawWho() {
      const version = ++whoVersion; bookingVersion++;
      clear(who); borrower = null; group = null; reservationId = '';
      if (kind.get() === 'student') {
        const picker = studentPicker('Student', (s) => { borrower = s; if (requestId && (!s || s.studentId !== request.studentId)) clearRequest(); loadBookings(); }, { status: 'verified' });
        const idBtn = ui.button('Identify by the student\'s QR', { size: 'sm', icon: 'qr', onClick: () => {
          let m; const sc = ui.scanner({ title: 'Student QR', onCode: async (code) => { try { const r = await api('student.identify', { qr: code }); if (version !== whoVersion) return; m.close(); borrower = r.student; if (requestId && r.student.studentId !== request.studentId) clearRequest(); picker.set(r.student); loadBookings(); LF.toast('Identified ' + r.student.name, 'good'); } catch (e) { LF.fail(e); } } });
          m = LF.modal('Identify the borrower', h('div', { style: { display: 'grid', gap: '10px' } }, h('p', { class: 'hint', style: { margin: 0 } }, 'Ask the student to open their live QR. This ties the loan to the person holding the registered phone.'), sc.el), { onClose: () => sc.stop() }); sc.focus();
        } });
        who.append(picker.el, idBtn);
        if (requestId && !borrower) { borrower = { studentId: request.studentId, rollNo: request.rollNo, name: request.name, status: 'verified' }; picker.set(borrower); }
      }
      else api('groups.list').then((r) => { if (version !== whoVersion) return; const sel = ui.field({ name: 'g', label: 'Group', type: 'select', options: [{ value: '', label: 'Choose a group' }].concat(r.groups.map((g) => ({ value: g.groupId, label: g.name + ' (' + g.members.length + ')' }))) }); sel.input.addEventListener('change', () => { group = sel.get() || null; loadBookings(); }); clear(who).append(sel.el); }).catch(LF.fail);
      loadBookings();
    }
    async function loadBookings() {
      const version = ++bookingVersion, selectedLab = lab.get(), selectedKind = kind.get();
      clear(bookingBox); reservationId = ''; selectedBooking = null; days.input.disabled = false; bookingInfo.hidden = true; refreshChecklist();
      const id = kind.get() === 'student' ? (borrower && borrower.studentId) : group; if (!id) return;
      try {
        const r = await api('booking.list', { status: 'approved', labId: selectedLab });
        if (version !== bookingVersion) return;

/* ------------------------------------------------------------------ Lab-wide board, separate from the session roster */
function liveBoard(root) {
  let snapshot = null, loading = false, alive = true, blocked = false, timer = null, intervalMs = Math.max(3, LF.me.settings.occupancyRefreshSeconds || 5) * 1000;
  const message = h('div', { class: 'hint', role: 'status' }, 'Loading current visits…');
  const out = h('div', { style: { display: 'grid', gap: '20px', minWidth: 0 } });
  const labFilter = h('select', { class: 'input', 'aria-label': 'Board lab', style: { maxWidth: '100%' }, onchange: draw }, h('option', { value: '' }, 'All accessible labs'));
  const search = h('input', { class: 'input', type: 'search', 'aria-label': 'Search live board', placeholder: 'Name, register number, project or system', style: { maxWidth: '100%', minWidth: 0 }, oninput: draw });
  const refresh = ui.button('Refresh board', { icon: 'refresh', onClick: () => { blocked = false; return load(); } });
  root.append(h('h1', { class: 't-h1' }, 'Live lab board'), h('p', { class: 't-muted' }, 'People currently checked in, their reported projects and systems, and workstation availability.'),
    h('div', { class: 'toolbar', style: { flexWrap: 'wrap', marginBottom: '12px' } }, h('label', { class: 'field', style: { minWidth: 0 } }, 'Lab', labFilter),
      h('label', { class: 'field', style: { flex: '1', minWidth: 'min(100%, 220px)' } }, 'Search', search), refresh), message, out);
  const cell = (text) => h('span', { style: { display: 'block', maxWidth: '240px', whiteSpace: 'normal', overflowWrap: 'anywhere' } }, text);
  const statusLabels = { free: 'Free', busy: 'Busy', booked: 'Booked', unavailable: 'Unavailable' };
  function draw() {
    if (!snapshot || !alive) return;
    const q = search.value.trim().toLowerCase(), matches = (values) => !q || values.join(' ').toLowerCase().includes(q);
    const scroll = {};
    out.querySelectorAll('[data-board-lab]').forEach((section) => { const table = section.querySelector('.tbl-wrap'); if (table) scroll[section.dataset.boardLab] = table.scrollLeft; });
    clear(out);
    snapshot.labs.filter((l) => !labFilter.value || l.labId === labFilter.value).forEach((lab) => {
      const visits = lab.visits.filter((v) => matches([v.name, v.rollNo, v.sessionTitle, v.projectTitle, v.assetName, v.assetTag]));
      const systems = lab.systems.filter((s) => matches([s.name, s.assetTag, statusLabels[s.status]]));
      if (q && !visits.length && !systems.length) return;
      const table = ui.table({ caption: lab.name + ' current visits', search: false, pageSize: 100,
        empty: ui.empty(q ? 'No matching visitors' : 'Nobody checked in', 'Current visits appear here after entry.'), rows: visits,
        columns: [
          { label: 'Student', render: (v) => h('div', null, cell(v.name), h('div', { class: 'hint' }, v.rollNo)) },
          { label: 'Session', render: (v) => cell(v.sessionTitle) },
          { label: 'Project', render: (v) => cell(v.projectTitle || 'No project selected') },
          { label: 'System', render: (v) => cell(v.assetName ? v.assetName + (v.assetTag ? ' · ' + v.assetTag : '') : 'No lab system selected') },
          { label: 'Inside since', render: (v) => h('time', { datetime: new Date(v.since).toISOString() }, fmt.dt(v.since)) }]
      });
      const dataTable = table.el.querySelector('table');
      if (dataTable) dataTable.style.minWidth = '760px';
      const section = h('section', { class: 'card', role: 'region', 'aria-label': lab.code + ' live board', dataset: { boardLab: lab.labId }, style: { minWidth: 0, overflow: 'hidden' } },
        h('div', { class: 'toolbar', style: { justifyContent: 'space-between', flexWrap: 'wrap' } }, h('h2', { class: 't-h2' }, lab.name), h('span', { class: 'hint' }, lab.code)),
        h('p', null, h('strong', null, String(lab.inside)), ' people inside' + (lab.capacity ? ' · ' + lab.capacity + ' seats' : ''),
          ' · ' + lab.systems.filter((s) => s.status === 'free').length + ' of ' + lab.systems.length + ' systems free'),
        table.el, h('h3', { class: 't-h3', style: { marginTop: '16px' } }, 'Systems'),
        systems.length ? h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 190px), 1fr))', gap: '8px' } }, systems.map((s) =>
          h('article', { 'aria-label': s.assetTag || s.name, style: { border: '1px solid var(--line)', borderRadius: '8px', padding: '10px', minWidth: 0, overflowWrap: 'anywhere' } },
            h('strong', null, s.name), h('div', { class: 'hint' }, s.assetTag), ui.badge(statusLabels[s.status], s.status === 'free' ? 'good' : s.status === 'unavailable' ? 'bad' : 'warn')))) :
          h('p', { class: 'hint' }, q ? 'No matching systems.' : 'No workstations configured.'));
      out.append(section);
      const scroller = section.querySelector('.tbl-wrap');
      if (scroller) scroller.scrollLeft = scroll[lab.labId] || 0;
    });
    if (!out.children.length) out.append(ui.empty(snapshot.labs.length ? 'No matches' : 'No accessible labs', snapshot.labs.length ? 'Try a different lab or search.' : 'No active labs are available in your scope.'));
  }
  async function load() {
    if (!alive || loading) return;
    loading = true; refresh.disabled = true;
    try {
      const result = await api('labs.live'); if (!alive) return;
      snapshot = result; LF.setServerNow(result.serverNow);
      const selected = labFilter.value;
      clear(labFilter).append(h('option', { value: '' }, 'All accessible labs'), ...result.labs.map((l) => h('option', { value: l.labId }, l.name)));
      labFilter.value = result.labs.some((l) => l.labId === selected) ? selected : '';
      draw(); message.textContent = 'Updated ' + fmt.time(result.serverNow) + ' · refreshes every ' + result.refreshSeconds + ' seconds';
      const nextInterval = Math.max(3, result.refreshSeconds) * 1000;
      if (nextInterval !== intervalMs) {
        clearInterval(timer); intervalMs = nextInterval;
        timer = LF.every(intervalMs, () => { if (!blocked) load(); });
      }
    } catch (e) {
      if (!alive) return;
      snapshot = null; clear(out); // clear identities rather than display an old snapshot after access changes
      blocked = ['FORBIDDEN', 'NOT_IMPLEMENTED'].includes(e.code);
      message.textContent = 'Refresh failed. Previous results have been cleared.';
      out.append(e.code === 'NOT_IMPLEMENTED' && LF.role === 'hod' ? ui.empty('Department access is being configured', 'The live board will be available once department scope is ready.') : ui.errorBox(e));
    } finally { loading = false; if (alive) refresh.disabled = false; }
  }
  LF.onLeave(() => { alive = false; if (timer) clearInterval(timer); snapshot = null; });
  timer = LF.every(intervalMs, () => { if (!blocked) load(); });
  load();
}
LF.liveLabBoard = liveBoard;
