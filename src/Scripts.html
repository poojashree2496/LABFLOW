<script>
/* LABFLOW client core. Vanilla JS, no framework. All DOM is built with h() using textContent, never innerHTML with data,

(function () {

const LF = window.LF = { routes: {}, ui: {}, util: {}, fmt: {}, me: null, role: null, current: null, cleanups: [], timers: [] };

/* ------------------------------------------------------------------ DOM helpers */

/* ------------------------------------------------------------------ time (always Asia/Kolkata, never the device zone) */

LF.fmt.date = (ms) => ms ? df.format(ms) : '-';

/* ------------------------------------------------------------------ API */
class ApiError extends Error { constructor(code, message, extra) { super(message); this.code = code; this.extra = extra || null; } }

/* Two transports. The Apps Script page uses google.script.run (identity from the Google session). The hosted app

const CFG = window.LF_CONFIG || null;
LF.hosted = !!(CFG && CFG.apiUrl);

  get: () => { try { return localStorage.getItem('lf-session') || ''; } catch (e) { return ''; } },
  set: (v) => { try { localStorage.setItem('lf-session', v); } catch (e) { /* ignore */ } },
  clear: () => { try { localStorage.removeItem('lf-session'); } catch (e) { /* ignore */ } }

    const res = await fetch(CFG.apiUrl, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow',
      body: JSON.stringify({ action, payload: payload === undefined ? {} : payload, session: LF.session.get() }) });

    throw new ApiError(r.error.code, r.error.message, r.error.extra);

}

  if (LF.hosted) return fetchCall(action, payload);
  return new Promise((resolve, reject) => {
    if (!(window.google && google.script && google.script.run)) return reject(new ApiError('NETWORK', 'This page must be opened from the LABFLOW web app link.'));
    google.script.run
      .withSuccessHandler((r) => {
        if (r && r.ok) return resolve(r.data);
        if (r && r.error) return reject(new ApiError(r.error.code, r.error.message, r.error.extra));
        reject(new ApiError('NETWORK', 'The server returned an unexpected response.'));

      .withFailureHandler((e) => reject(new ApiError('NETWORK', (e && e.message) ? String(e.message).replace(/^Error:\s*/, '') : 'Could not reach the server. Check your connection.')))

}

  const max = opts && opts.retry ? 3 : 1;
  for (let i = 1; ; i++) {
    try { const d = await rawCall(action, payload); if (d && typeof d.serverNow === 'number') LF.setServerNow(d.serverNow); return d; }
    catch (e) {
      const transient = e.code === 'NETWORK' || e.code === 'BUSY';

      await new Promise((r) => setTimeout(r, 500 * i * i));

}
LF.api = api;

/* ------------------------------------------------------------------ feedback widgets */
function toast(msg, kind) {

LF.toast = toast;
function errMsg(e) { return e instanceof ApiError ? e.message : 'Something unexpected happened. Please try again.'; }

let modalSeq = 0;

function confirmBox(o) {

function empty(title, text, action) { return h('div', { class: 'empty' }, h('div', { class: 't-h3' }, title), text ? h('p', { class: 'hint', style: { margin: '6px 0 0' } }, text) : null, action ? h('div', { style: { marginTop: '12px' } }, action) : null); }

/** Run an async loader into `root` showing skeleton -> content or error. Returns a reload function. */

    clear(root).appendChild(skeleton(rows));
    try { const out = await fn(); clear(root); if (out) append(root, [out]); }
    catch (e) { clear(root).appendChild(errorBox(e, run)); }

}

function button(label, opts) {

  const b = h('button', { class: 'btn ' + (opts.kind ? 'btn-' + opts.kind : '') + (opts.size ? ' btn-' + opts.size : '') + (opts.block ? ' btn-block' : ''), type: opts.type || 'button', title: opts.title, 'aria-label': opts.aria }, opts.icon ? icon(opts.icon) : null, label);

/* ------------------------------------------------------------------ forms */

/** opts: { title, fields, submitLabel, onSubmit(values) -> Promise, intro, wide } ; closes on success. */

  const top = h('div', { class: 'err', role: 'alert', hidden: true, style: { marginBottom: '8px' } });
  let m;

  const form = h('form', { novalidate: true, onsubmit: async (e) => {
    e.preventDefault(); top.hidden = true;
    const values = {}; let bad = false;
    fields.forEach((x) => { x.input.removeAttribute('aria-invalid'); if (x.err) x.err.hidden = true; });
    fields.forEach((x) => {

      if (x.f.required && (v === '' || v === null || v === undefined)) { bad = true; x.input.setAttribute('aria-invalid', 'true'); if (x.err) { x.err.textContent = 'This field is required.'; x.err.hidden = false; } }

    h('div', { style: { display: 'grid', gap: '12px', gridTemplateColumns: opts.cols === 2 ? 'repeat(auto-fit,minmax(220px,1fr))' : '1fr' } }, fields.map((x) => x.el)),
    h('div', { style: { display: 'flex', gap: '8px', justifyContent: 'flex-end', marginTop: '16px', flexWrap: 'wrap' } }, h('button', { class: 'btn', type: 'button', onclick: () => m.close() }, 'Cancel'), submit));

/* ------------------------------------------------------------------ tables */
/** columns: [{ key, label, render(row)->Node|string, text(row)->string (search/sort), sort:true, align }] */

  const filterSel = (o.filters || []).map((f) => {

    });

      h('thead', null, h('tr', null, o.columns.map((c) => h('th', { scope: 'col', style: { textAlign: c.align || 'left' }, 'aria-sort': sortKey === c.key ? (sortDir > 0 ? 'ascending' : 'descending') : null },
        c.sort === false || !c.key ? c.label : h('button', { type: 'button', onclick: () => { if (sortKey === c.key) sortDir = -sortDir; else { sortKey = c.key; sortDir = 1; } draw(); } }, c.label + (sortKey === c.key ? (sortDir > 0 ? ' ▲' : ' ▼') : '')))))),

      h('button', { class: 'btn btn-sm', disabled: page === 0, onclick: () => { page--; draw(); } }, 'Previous'), h('span', { class: 'hint' }, 'Page ' + (page + 1) + ' of ' + pages),

}
LF.ui.table = table;

function tabs(items, initial) {

  function select(id) {

    clear(panel); const out = items[i].render(panel); if (out instanceof Node) panel.appendChild(out);

  append(bar, btns);

}
LF.ui.tabs = tabs;

function stat(label, value, sub, kind) { return h('div', { class: 'card ' + (kind || '') }, h('div', { class: 't-label', style: kind ? { color: 'inherit', opacity: .75 } : null }, label), h('div', { class: 't-big', style: { margin: '4px 0' } }, value), sub ? h('div', { class: 'hint', style: kind ? { color: 'inherit', opacity: .8 } : null }, sub) : null); }
LF.ui.stat = stat;

/** Tiny SVG bar chart over real data: data = [{ label, a, b? }]. */
function barChart(data, o) {

    if (d.b !== undefined) mk('rect', { x: x + w, y: H - pad.b - hh(d.b || 0), width: w, height: hh(d.b || 0), class: 'chart-bar2' });
    if (data.length <= 16 || i % Math.ceil(data.length / 12) === 0) { const t = mk('text', { x: pad.l + i * bw + bw / 2, y: H - 10, 'text-anchor': 'middle', class: 'chart-text' }); t.textContent = d.label; }

    h('div', { class: 'field' }, h('label', { for: 'ob-name' }, 'Full name *'), name),
    h('div', { class: 'field' }, h('label', { for: 'ob-mobile' }, 'Mobile number' + (me.settings.requireMobile ? ' *' : '')), mobile),
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px' } }, h('div', { class: 'field' }, h('label', { for: 'ob-dept' }, 'Department'), dept), h('div', { class: 'field' }, h('label', { for: 'ob-sec' }, 'Section'), section), h('div', { class: 'field' }, h('label', { for: 'ob-year' }, 'Year'), year)),

/* ------------------------------------------------------------------ boot */
async function boot() {
  if (LF.hosted && !LF.session.get()) return signInScreen();
  let me;
  try { me = await api('me', {}, { retry: true }); } catch (e) { return blocked(e); }
  LF.me = me; LF.setServerNow(me.serverNow);
  if (me.kiosk) { LF.role = 'kiosk'; LF.current = (LF.routes.kiosk || [])[0]; return renderKiosk(); }
  if (me.onboardingRequired) return onboarding();
  const roles = ROLE_ORDER.filter((r) => me.roles.includes(r));
  if (!roles.length) return blocked(new ApiError('FORBIDDEN', 'Your account has no role yet. Ask the administrator to assign one.'));
  const hsh = readHash(); let saved = null; try { saved = sessionStorage.getItem('lf-role'); } catch (e) { /* ignore */ }
  LF.role = hsh && roles.includes(hsh.role) ? hsh.role : (saved && roles.includes(saved) ? saved : roles[roles.length > 1 ? 0 : 0]);
  if (!hsh && roles.includes('student') && roles.length === 1) LF.role = 'student';
  const list = visible(LF.role);
  LF.current = (hsh && list.find((v) => v.id === hsh.id)) || list[0];
  renderShell(); refreshUnread();
  LF.every(60000, refreshUnread);
  if (me.consentRequired || me.profileIncomplete) await consentGate();
  handleLaunch();
}

/* A QR link opened the app: ?k= (student scanned the kiosk screen, Version A) or ?s= (a teacher, staff member or
   class rep scanned a student's QR, Version B). The page only forwards the code; the server decides. Each link is
   handled once, then removed from the address bar. */
/* The hosted app has no server template, so it reads the link itself, with the same character checks as launchJson_. */
function launchFromUrl() {
  const q = new URLSearchParams(location.search), out = {}, k = q.get('k'), s = q.get('s');
  if (k && /^[A-Za-z0-9._-]{10,200}$/.test(k)) out.k = k;
  if (s && /^[A-Za-z0-9._~-]{40,600}$/.test(s)) out.s = s;
  return out;
}
function handleLaunch() {
  const l = window.LF_LAUNCH || (LF.hosted ? launchFromUrl() : {}); window.LF_LAUNCH = {};
  try { if (l.k || l.s) history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* ignore */ }
  if (l.k) {
    if (!LF.me.roles.includes('student')) return toast('That code is for students checking in. Scan it with a student account.', 'bad');
    if (LF.role !== 'student') LF.go('today', 'student');
    if (LF.kioskCheckin) LF.kioskCheckin(l.k);
  } else if (l.s && LF.scanLink) LF.scanLink(l.s);
}
function renderKiosk() { runCleanups(); const root = appRoot(); clear(root); const out = LF.current.render(root); if (typeof out === 'function') LF.onLeave(out); }
LF.boot = boot;
LF.start = () => {
  if (LF.hosted && /[?&]signout\b/.test(location.search)) { LF.session.clear(); try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } }
  boot().catch((e) => { console.error(e); blocked(new ApiError('INTERNAL', 'LABFLOW failed to start. Reload the page.')); }); };
window.addEventListener('hashchange', () => { const hs = readHash(); if (hs && LF.me && hs.role === LF.role && (!LF.current || hs.id !== LF.current.id)) LF.go(hs.id, hs.role); });
document.addEventListener('visibilitychange', () => { /* timers skip while hidden; nothing else needed */ });
LF.on = { roleChange: (r) => { try { sessionStorage.setItem('lf-role', r); } catch (e) { /* ignore */ } } };

/* role switch handler needs the chosen role: patched go() */
const goBase = LF.go;
LF.go = (id, role) => { if (role) LF.on.roleChange(role); goBase(id, role); };

/* ------------------------------------------------------------------ scanning (phone scanner, kiosk scanner, desk identification) */
/** A QR input: a USB/Bluetooth keyboard-wedge scanner or a paste (Enter submits), plus the camera where the browser has
    BarcodeDetector. opts: { onCode(code), title, label } -> { el, focus(), stop(), cameraOn() } */
LF.ui.scanner = (opts) => {
  let camStream = null, camTimer = null, last = '', lastAt = 0;
  const input = h('input', { class: 'input', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, 'aria-label': opts.label || 'Scanner input. Scan a code or paste it and press Enter.', placeholder: 'Scan, or paste a code and press Enter', style: { fontFamily: 'ui-monospace, monospace' } });
  const video = h('video', { class: 'scanbox', playsinline: true, muted: true, hidden: true, 'aria-label': 'Camera preview' });
  const submit = (raw) => { const code = String(raw || '').trim(); if (!code) return; if (code === last && Date.now() - lastAt < 5000) return; last = code; lastAt = Date.now(); opts.onCode(code); };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const v = input.value; input.value = ''; submit(v); } });
  input.addEventListener('paste', () => setTimeout(() => { const v = input.value; if (v.length > 30 && (v.indexOf('~') > 0 || v.indexOf('?') > 0 || /^k1\./.test(v))) { input.value = ''; submit(v); } }, 0));
  const camBtn = button('Use camera', { icon: 'camera', onClick: async () => { if (camStream) return stopCam(); await startCam(); } });
  async function startCam() {
    if (!('BarcodeDetector' in window)) { toast('This browser cannot read QR codes from the camera. Use a scanner, or the phone camera app to open the code\'s link.', 'bad'); return; }
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { toast('Camera access is not available here.', 'bad'); return; }
    try {
      const det = new window.BarcodeDetector({ formats: ['qr_code'] });

      video.srcObject = camStream; video.hidden = false; await video.play(); camBtn.lastChild.textContent = 'Stop camera';
      camTimer = setInterval(async () => { try { const r = await det.detect(video); if (r.length) submit(r[0].rawValue); } catch (e) { /* frame not ready */ } }, 300);
    } catch (e) { stopCam(); toast(e && e.name === 'NotAllowedError' ? 'Camera permission was denied.' : 'Could not start the camera.', 'bad'); }
  }
  function stopCam() { clearInterval(camTimer); if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null; video.hidden = true; camBtn.lastChild.textContent = 'Use camera'; }
  LF.onLeave(stopCam);
  return { el: h('div', { style: { display: 'grid', gap: '10px' } }, h('div', { class: 'field' }, h('label', null, opts.title || 'Scan a code'), input), video, h('div', { class: 'toolbar' }, camBtn)),
    input, focus: () => input.focus({ preventScroll: true }), stop: stopCam, cameraOn: () => !!camStream, submit };
};

const SCAN_LABEL = { IN: 'Checked in', OUT: 'Checked out', RESCAN: 'Presence confirmed' };
LF.SCAN_LABEL = SCAN_LABEL;
/** Accepted scan: name, roll number, direction, and the photo on file so a mismatch is obvious to anyone watching. */
LF.ui.scanResult = (r) => {

  if (r.student.hasPhoto) api('scan.photo', { eventId: r.eventId }).then((p) => { if (p.dataUrl) photo.replaceWith(h('img', { class: 'photo', src: p.dataUrl, alt: 'Photo of ' + r.student.name })); else photo.textContent = 'No photo on file'; }).catch(() => { photo.textContent = 'Photo unavailable'; });
  return h('div', { class: 'result good', role: 'status' }, photo, h('div', null, h('div', { class: 't-big', style: { fontSize: '30px' } }, SCAN_LABEL[r.type] || r.type), h('div', { class: 't-h3' }, r.student.name + ' · ' + r.student.rollNo),
    h('div', { class: 'hint' }, r.session.title + ' · ' + LF.fmt.time(r.at) + (r.assurance ? ' · ' + r.assurance + ' assurance' : ''))));

LF.ui.scanError = (e) => h('div', { class: 'result bad', role: 'alert' }, h('div', { class: 'bad-big', style: { width: '64px', height: '64px' } }, icon('x')), h('div', null, h('div', { class: 't-h3' }, e.extra && e.extra.student ? e.extra.student + ': not accepted' : 'Not accepted'), h('div', null, errMsg(e))));

/**
 * The phone scanner (Version B) for a teacher, lab staff, an event coordinator or a class representative. Scans with
 * the in-app camera or a connected scanner; a code opened from the phone's own camera app arrives through scanLink().
 */
LF.openPhoneScanner = (title, first) => {
  const results = h('div', { style: { display: 'grid', gap: '8px' } }), count = h('span', { class: 'badge info' }, '0 scanned');
  let n = 0, busy = Promise.resolve();
  const sc = LF.ui.scanner({ title: 'Student QR', onCode: (code) => { busy = busy.then(() => run(code)); } });
  async function run(code) {
    try { const r = await api('scan.submit', { qr: code }); n++; count.textContent = n + ' scanned'; results.prepend(LF.ui.scanResult(r)); }
    catch (e) { results.prepend(LF.ui.scanError(e)); }
    while (results.children.length > 8) results.lastChild.remove();
  }
  const m = modal(title || 'Scan students', h('div', { style: { display: 'grid', gap: '12px' } },
    h('p', { class: 'hint', style: { margin: 0 } }, 'Point the camera at the student\'s phone, or open their QR with your phone\'s camera app. Check that the photo matches the person in front of you.'),
    sc.el, h('div', { class: 'toolbar', style: { justifyContent: 'space-between' } }, h('strong', null, 'Results'), count), results), { wide: true, onClose: () => sc.stop() });
  if (first) busy = busy.then(() => run(first)); else sc.focus();

};
LF.scanLink = (code) => LF.openPhoneScanner('Scanned from a QR link', code);

/* ------------------------------------------------------------------ live occupancy (FR-16) */

      return h('div', { class: 'occ-card' + (l.overCapacity ? ' over' : '') }, h('div', { class: 'toolbar', style: { justifyContent: 'space-between' } }, h('span', { class: 't-label' }, l.code), l.overCapacity ? badge('over capacity', 'bad') : null),
        h('div', { class: 't-h3' }, l.name), h('div', null, h('span', { class: 't-big', style: { fontSize: '30px' } }, String(l.inside)), cap ? h('span', { class: 'hint' }, ' inside of ' + cap) : h('span', { class: 'hint' }, ' inside')),
        h('div', { class: 'meter' }, h('i', { style: { width: pct + '%' } })), h('div', { class: 'hint' }, l.sessions.length ? l.sessions.map((s) => s.title + (s.onBreak ? ' (break)' : '')).join(', ') : 'No session open'));

};

/* ------------------------------------------------------------------ flags review (faculty, staff, admin) */
LF.ui.flagsView = () => {
  const out = h('div'), status = h('select', { class: 'input', 'aria-label': 'Flag status', style: { maxWidth: '200px' } }, [['open', 'Open'], ['resolved', 'Resolved'], ['dismissed', 'Dismissed'], ['all', 'All']].map(([v, l]) => h('option', { value: v }, l)));

/* ------------------------------------------------------------------ generic reports view (all roles) */
const REPORT_LABEL = { digest: 'Daily digest (per lab)', monthlyAudit: 'Monthly audit', custom: 'Custom date range', session: 'Session log', erp: 'ERP export (fixed columns)', daily: 'Daily sessions table', monthly: 'Monthly summary',
  faculty: 'Faculty report', student: 'Student attendance', utilisation: 'Lab utilisation', assetUsage: 'Asset usage', inventory: 'Inventory snapshot', overdue: 'Overdue loans', audit: 'Audit trail' };
LF.ui.reports = (allowed) => {
  const box = h('div', { style: { display: 'grid', gap: '16px' } }), out = h('div');
  const type = h('select', { class: 'input', id: 'rp-type', style: { maxWidth: '280px' } }, allowed.map((t) => h('option', { value: t }, REPORT_LABEL[t])));
  const date = h('input', { class: 'input', type: 'date', id: 'rp-date', value: LF.fmt.todayIst() });
  const month = h('input', { class: 'input', type: 'month', id: 'rp-month', value: LF.fmt.todayIst().slice(0, 7) });
  const from = h('input', { class: 'input', type: 'date', id: 'rp-from', value: new Date(Date.now() - 30 * 86400000 + IST_MIN * 60000).toISOString().slice(0, 10) });
  const to = h('input', { class: 'input', type: 'date', id: 'rp-to', value: LF.fmt.todayIst() });
  const who = h('input', { class: 'input', id: 'rp-who', placeholder: 'Student roll number' });
  const fac = h('select', { class: 'input', id: 'rp-fac', 'aria-label': 'Faculty member' }); let facLoaded = false;
  const lab = h('select', { class: 'input', id: 'rp-lab', 'aria-label': 'Lab' }, h('option', { value: '' }, 'All labs')); let labsLoaded = false;
  const ses = h('select', { class: 'input', id: 'rp-ses', 'aria-label': 'Session' }); let sesLoaded = '';
  const wrap = (lbl, el, id) => h('div', { class: 'field', dataset: { k: id } }, h('label', { for: el.id }, lbl), el);
  const fDate = wrap('Date', date, 'date'), fMonth = wrap('Month', month, 'month'), fFrom = wrap('From', from, 'from'), fTo = wrap('To', to, 'to'), fWho = wrap('Student', who, 'who'), fFac = wrap('Faculty member', fac, 'fac'), fLab = wrap('Lab', lab, 'lab'), fSes = wrap('Session', ses, 'ses');
  const RANGED = ['faculty', 'student', 'utilisation', 'assetUsage', 'audit', 'custom', 'erp'];
  let last = null;
  const priv = () => LF.me.roles.includes('admin') || LF.me.roles.includes('staff');
  function loadSessions() {
    const d = date.value; if (sesLoaded === d) return; sesLoaded = d; clear(ses);
    api('sessions.day', { date: d }).then((r) => { const xs = r.sessions.filter((s) => s.status === 'open' || s.status === 'closed'); if (!xs.length) ses.append(h('option', { value: '' }, 'No sessions held that day')); xs.forEach((s) => ses.append(h('option', { value: s.sessionId }, LF.fmt.time(s.scheduledStart) + ' ' + s.title + ' · ' + (s.labCode || '')))); }).catch(fail);
  }
  function sync() {
    const t = type.value;
    fDate.hidden = !(t === 'daily' || t === 'digest' || t === 'session'); fMonth.hidden = !(t === 'monthly' || t === 'monthlyAudit');
    fFrom.hidden = fTo.hidden = RANGED.indexOf(t) < 0;
    fFac.hidden = !(t === 'faculty' && priv()); if (!fFac.hidden && !facLoaded) { facLoaded = true; api('directory.faculty').then((r) => { r.faculty.forEach((f) => fac.appendChild(h('option', { value: f.facultyId }, f.name))); }).catch(fail); }

    fLab.hidden = !(t === 'digest' || t === 'custom'); if (!fLab.hidden && !labsLoaded) { labsLoaded = true; api('labs.list').then((r) => r.labs.forEach((l) => lab.appendChild(h('option', { value: l.labId }, l.code + ' ' + l.name)))).catch(fail); }

  }

  async function params() {
    const t = type.value, p = { type: t };

    if (t === 'monthly' || t === 'monthlyAudit') p.month = month.value;
    if (RANGED.indexOf(t) >= 0) { p.from = from.value; p.to = to.value; }
    if ((t === 'digest' || t === 'custom') && lab.value) p.labId = lab.value;
    if (t === 'session') { if (!ses.value) throw new ApiError('BAD_INPUT', 'Choose a session.'); p.sessionId = ses.value; }

    if (t === 'student' && who.value.trim()) { const r = await api('students.list', { q: who.value.trim(), limit: 5 }); const s = r.students.find((x) => x.rollNo.toLowerCase() === who.value.trim().toLowerCase()) || r.students[0]; if (!s) throw new ApiError('NOT_FOUND', 'No student matches that roll number.'); p.studentId = s.studentId; }
    return p;
  }
  const sectionTable = (s, title) => table({ columns: s.columns.map((c, i) => ({ key: 'c' + i, label: c, text: (row) => row[i] === null || row[i] === undefined ? '' : String(row[i]), render: (row) => (row[i] === null || row[i] === undefined ? '' : String(row[i])), align: typeof (s.rows[0] || [])[i] === 'number' ? 'right' : 'left' })), rows: s.rows, pageSize: 50, caption: title || s.title, search: s.rows.length > 10 }).el;
  const run = button('Run report', { kind: 'primary', icon: 'chart', onClick: async () => {
    const p = await params(); clear(out).appendChild(skeleton(5));
    try {
      const r = await api('reports.run', p); last = p; clear(out);
      const sections = r.sections || [{ title: '', columns: r.columns, rows: r.rows }];
      append(out, [h('div', { class: 'toolbar', style: { justifyContent: 'space-between', marginBottom: '8px' } }, h('h3', { class: 't-h2' }, r.title),
        h('div', { class: 'toolbar' }, button('CSV', { icon: 'download', size: 'sm', onClick: async () => { const c = await api('reports.csv', last); LF.util.download(c.filename, c.csv, 'text/csv'); } }),
          button('PDF', { icon: 'download', size: 'sm', onClick: async () => { toast('Preparing PDF...'); const c = await api('reports.pdf', last); LF.util.download(c.filename, c.base64, 'application/pdf', true); if (c.truncated) toast('PDF shows the first 1000 rows. Use CSV for everything.'); } }))),
        r.summary && r.summary.length ? h('div', { class: 'grid-stats', style: { marginBottom: '12px' } }, r.summary.map(([k, v]) => stat(k, String(v)))) : null,
        r.truncated ? h('div', { class: 'card warn', style: { marginBottom: '8px' } }, 'Showing the first 5000 rows only. Narrow the date range for the full data.') : null,
        h('div', { style: { display: 'grid', gap: '16px' } }, sections.map((s) => h('section', null, s.title ? h('h4', { class: 't-h3', style: { margin: '0 0 6px' } }, s.title) : null, sectionTable(s, r.title))))]);
    } catch (e) { clear(out).appendChild(errorBox(e)); }
  } });
  append(box, [h('div', { class: 'card', style: { display: 'flex', gap: '12px', flexWrap: 'wrap', alignItems: 'end' } }, h('div', { class: 'field' }, h('label', { for: 'rp-type' }, 'Report'), type), fDate, fMonth, fFrom, fTo, fLab, fSes, fWho, fFac, run), out]);
  return box;
};
const ui = LF.ui;
})();
