<script>
/* Faculty views: today's sessions, live roster, spot checks, corrections, events/research, students, equipment, reports. */
(function () {
'use strict';
const LF = window.LF, h = LF.h, icon = LF.icon, api = LF.api, fmt = LF.fmt, ui = LF.ui, clear = LF.clear;
LF.sel = LF.sel || { sessionId: null };

const times = (s) => fmt.time(s.scheduledStart) + ' - ' + fmt.time(s.scheduledEnd);
const TYPE_LABEL = { class: 'Class', event: 'Event', research: 'Research', openlab: 'Open lab' };
/** How a student was checked in: kiosk or phone scan, who scanned (class rep / coordinator are tagged), GPS result. */

    x.scannerRole === 'cr' ? h('span', { title: 'Scanned by ' + x.scannedBy }, ui.badge('by CR', 'warn')) : x.scannerRole === 'coordinator' ? h('span', { title: 'Scanned by ' + x.scannedBy }, ui.badge('by event lead', 'info')) : null,
    x.geofence === 'pass' ? ui.badge('GPS ok', 'good') : x.geofence === 'fail' ? ui.badge('outside the lab', 'bad') : x.geofence === 'na' ? ui.badge('no GPS', 'warn') : null, x.assurance === 'lower' ? ui.badge('lower assurance', 'warn') : x.assurance === 'flagged' ? ui.badge('flagged', 'bad') : null);

/** Phone app (tier 3): last report, at the lab now, share of the session at the lab, fingerprint checks, open flags. */

    h('span', { class: 'pill-row' }, a.atLab === true ? ui.badge('at the lab', 'good') : a.atLab === false ? ui.badge('away', 'bad') : ui.badge('no fix', 'warn'), a.coveragePct !== null ? ui.badge(a.coveragePct + '% of session', a.coveragePct >= 75 ? 'good' : 'warn') : null),
    h('span', { class: 'hint' }, a.lastReportAt ? 'Last report ' + fmt.time(a.lastReportAt) + (a.lastDistanceM !== null ? ' · ' + Math.round(a.lastDistanceM) + ' m' : '') : 'No report yet'),
    a.checks.length || a.flags.length ? h('span', { class: 'pill-row' }, a.checks.map((k) => ui.badge('fingerprint ' + k.outcome, CHECK_KIND[k.outcome] || '')), a.flags.map((f) => ui.badge(f.replace(/_/g, ' '), 'bad'))) : null);

/** Shared by faculty and admin. */

    String(s.labMode || '').indexOf('B') >= 0 ? ui.button('Scan students', { icon: 'scan', onClick: () => LF.openPhoneScanner('Scan students: ' + s.title) }) : null,
    ui.button('Close session', { icon: 'x', onClick: () => closeFlow(s, reload) }));

    h('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '8px', flexWrap: 'wrap' } },
      h('div', null, h('div', { class: 't-h3' }, s.title), h('div', { class: 'hint' }, s.labName + ' · ' + times(s) + (s.section ? ' · Batch ' + s.section : '') + (s.facultyName ? ' · ' + s.facultyName : ''))),
      h('div', { class: 'pill-row' }, ui.badge(TYPE_LABEL[s.type] || s.type, ''), s.labMode ? ui.badge(s.labMode.charAt(0) === 'C' ? 'phone app (tier 3)' : s.labMode === 'A' ? 'kiosk QR + GPS' : s.labMode === 'B' ? 'device QR' : 'both modes', 'info') : null, ui.status(s.status))),
    c ? h('div', { class: 'pill-row', style: { marginTop: '10px' } }, ui.badge('Inside ' + c.inside + (c.capacity ? ' / ' + c.capacity : ''), c.overCapacity ? 'bad' : 'good'), c.onBreak ? ui.badge('on break', 'warn') : null, ui.badge('Left ' + c.left, ''), c.enrolled !== null ? ui.badge('Enrolled ' + c.enrolled, 'info') : ui.badge('Open to all', 'info'), c.absent !== null ? ui.badge('Absent ' + c.absent, c.absent ? 'warn' : '') : null, c.unverifiedExits ? ui.badge('Exit not scanned ' + c.unverifiedExits, 'warn') : null, c.flagged ? ui.badge('Flagged ' + c.flagged, 'bad') : null) : null,
    s.notes ? h('div', { class: 'hint', style: { marginTop: '6px' } }, s.notes) : null,
    actions.length ? h('div', { class: 'toolbar', style: { marginTop: '12px' } }, actions) : null);
};
function openFlow(s, reload, override) {
  const labMode = (s.labMode || 'A').replace('C', ''), modes = [{ value: 'A', label: 'Tier 1: kiosk QR + GPS, random location checks (recommended)' }, { value: 'B', label: 'Tier 2: device QR, scanned in the room' }, { value: 'AB', label: 'Tiers 1 and 2' }, { value: 'C', label: 'Tier 3: phone app, location for the whole session + fingerprint checks' }]

  const mode = modes.length > 1 ? ui.field({ name: 'checkinMode', label: 'How students check in', type: 'select', value: labMode.includes('A') ? 'A' : labMode, options: modes, hint: 'You can call a presence rescan at any time from the Live roster. Tier 3 still accepts students without the app (iPhones), flagged for you to review.' }) : null;
  const isAdmin = LF.me.roles.includes('admin');

  const msg = h('div', { class: 'err', role: 'alert', hidden: true });
  let m; const go = ui.button('Open session', { kind: 'primary', onClick: async () => {
    try { await api('sessions.open', { sessionId: s.sessionId, rescanMode: 'off', checkinMode: mode ? mode.get() : undefined, override: ov ? ov.get() : false }); m.close(); LF.toast('Session opened. Students can check in now.', 'good'); reload(); }
    catch (e) { msg.textContent = LF.errMsg(e); msg.hidden = false; }
  } });
  m = LF.modal('Open ' + s.title, h('div', { style: { display: 'grid', gap: '12px' } }, h('p', { class: 'hint', style: { margin: 0 } }, s.labName + ' · ' + times(s)), mode ? mode.el : null, ov ? ov.el : null, msg, h('div', { class: 'toolbar', style: { justifyContent: 'flex-end' } }, h('button', { class: 'btn', onclick: () => m.close() }, 'Cancel'), go)));
}
async function closeFlow(s, reload) {
  if (!await LF.confirm({ title: 'Close this session?', message: 'Students inside can still scan out for the exit grace period. Attendance records are not changed by closing.', confirmLabel: 'Close session' })) return;
  const r = await api('sessions.close', { sessionId: s.sessionId, reason: 'closed by faculty' });
  LF.toast('Session closed. ' + (r.counts.inside ? r.counts.inside + ' student(s) have no exit scan yet.' : 'Everyone is accounted for.'), 'good'); reload();

function cancelFlow(s, reload) {
  LF.ui.formModal({ title: 'Cancel ' + s.title, fields: [{ name: 'reason', label: 'Reason', type: 'textarea', rows: 2, required: true, maxlength: 200 }], submitLabel: 'Cancel session', onSubmit: async (v) => { await api('sessions.cancel', { sessionId: s.sessionId, reason: v.reason }); LF.toast('Session cancelled', 'good'); reload(); } });
}

/* ------------------------------------------------------------------ Today */
LF.register({ role: 'faculty', id: 'today', label: 'Today', icon: 'home', render(root) {
  const phones = h('div'), top = h('div', { class: 'grid-stats' }), list = h('div', { style: { display: 'grid', gap: '12px' } }), date = h('input', { class: 'input', type: 'date', value: fmt.todayIst(), 'aria-label': 'Date', style: { maxWidth: '180px' } });
  root.append(h('div', { class: 'toolbar', style: { justifyContent: 'space-between' } }, h('h1', { class: 't-h1' }, 'Today\'s labs'), date), top, phones, list);

  const drawPhones = () => api('cred.pending').then((r) => {
    clear(phones);
    if (!r.pending.length) return;
    phones.append(h('section', { class: 'card warn', 'aria-label': 'Phone switch requests' }, h('h2', { class: 't-h2' }, 'Phone switch requests'),
      h('p', { class: 'hint' }, 'A student linked the LABFLOW app on a new phone. Approve it only after checking it is really them (ID card).'),
      h('div', { style: { display: 'grid', gap: '8px' } }, r.pending.map((c) => h('div', { class: 'row' }, h('div', null, h('strong', null, (c.studentName || '') + ' · ' + (c.rollNo || '')), h('div', { class: 'hint' }, c.label + ' · ' + fmt.dt(c.createdAt))),
        h('div', { class: 'toolbar' }, ui.button('Approve', { size: 'sm', kind: 'primary', onClick: async () => { if (!await LF.confirm({ title: 'Approve this phone?', message: 'You checked the student in person. Their old phone stops working.', confirmLabel: 'Approve' })) return; await api('cred.approve', { credentialId: c.credentialId, idChecked: true }); LF.toast('Phone approved', 'good'); drawPhones(); } }),
          ui.button('Reject', { size: 'sm', kind: 'danger', onClick: async () => { await api('cred.reject', { credentialId: c.credentialId, reason: 'rejected by faculty' }); LF.toast('Request rejected', 'good'); drawPhones(); } })))))));
  }).catch(() => {});

  const reload = () => ui.loadInto(list, async () => {
    const [r, d] = await Promise.all([api('sessions.day', { date: date.value }), api('dash.faculty').catch(() => null)]);
    if (d) clear(top).append(ui.stat('Sessions today', d.sessions), ui.stat('Open now', d.open, null, d.open ? 'good' : ''), ui.stat('Research requests', d.pendingResearch, d.pendingResearch ? 'Waiting for your decision' : 'None pending', d.pendingResearch ? 'warn' : ''), ui.stat('Open flags', d.openFlags, d.openFlags ? 'Review under Flags' : 'Nothing to review', d.openFlags ? 'warn' : ''));
    if (!r.sessions.length) return ui.empty('No sessions on this date', 'Your timetable classes and events appear here. Create an event or research visit from the Plan tab.');
    return h('div', { style: { display: 'grid', gap: '12px' } }, r.sessions.map((s) => LF.sessionCard(s, reload)));
  });
  date.addEventListener('change', reload); reload();
  LF.every(20000, () => { if (!document.querySelector('.modal-back')) reload(); });
} });

/* ------------------------------------------------------------------ Live roster */
LF.register({ role: 'faculty', id: 'live', label: 'Live roster', icon: 'users', render(root) { return liveRoster(root); } });
LF.liveRoster = liveRoster;
function liveRoster(root) {
  const head = h('div'), body = h('div', { style: { display: 'grid', gap: '16px' } });
  root.append(h('h1', { class: 't-h1' }, 'Live roster'), head, body);
  let stop = false, session = null, polling = false;
  LF.onLeave(() => { stop = true; });

    const r = await api('sessions.day', { date: fmt.todayIst() });
    const usable = r.sessions.filter((s) => s.status === 'open' || s.status === 'closed');
    if (!LF.sel.sessionId || !usable.some((s) => s.sessionId === LF.sel.sessionId)) { const open = usable.find((s) => s.status === 'open') || usable[0]; LF.sel.sessionId = open ? open.sessionId : null; }
    clear(head);
    if (!usable.length) return null;
    head.append(h('div', { class: 'field', style: { maxWidth: '420px' } }, h('label', { for: 'ses-pick' }, 'Session'), h('select', { class: 'input', id: 'ses-pick', onchange: (e) => { LF.sel.sessionId = e.target.value; LF.go('live'); } }, usable.map((s) => h('option', { value: s.sessionId, selected: s.sessionId === LF.sel.sessionId }, s.title + ' · ' + times(s) + ' · ' + s.status)))));
    return LF.sel.sessionId;
  }
  async function refresh(first) {
    if (stop || polling) return; polling = true;
    try {
      const sid = first ? await pick() : LF.sel.sessionId;
      if (!sid) { if (first) clear(body).append(ui.empty('No open session', 'Open a session from the Today tab to see live attendance.')); return; }
      const r = await api('attend.roster', { sessionId: sid });
      session = r.session; draw(r);
    } catch (e) { if (first) clear(body).append(ui.errorBox(e, () => { polling = false; refresh(true); })); else LF.fail(e); }
    finally { polling = false; }
  }
  let tbl = null, panelSpot = h('div'), banner = h('div'), countsEl = h('div', { class: 'grid-stats' }), actionsEl = h('div', { class: 'toolbar' });
  function draw(r) {
    const c = r.counts, s = r.session;
    if (!tbl) {
      tbl = ui.table({ caption: 'Live roster', searchPlaceholder: 'Search roll no. or name', pageSize: 40,
        filters: [{ label: 'State', options: [{ value: 'in', label: 'Inside' }, { value: 'out', label: 'Left' }, { value: 'none', label: 'Not arrived' }], get: (x) => x.state }, { label: 'Status', options: ['present', 'partial', 'absent', 'unverified_exit', 'missed_rescan', 'flagged'], get: (x) => x.status }],
        columns: [
          { key: 'rollNo', label: 'Roll no.' }, { key: 'name', label: 'Name' },
          { key: 'state', label: 'State', render: (x) => x.state === 'in' ? ui.badge('Inside', 'good') : x.state === 'out' ? ui.badge('Left', '') : ui.badge('Not arrived', 'info'), text: (x) => x.state },
          { key: 'status', label: 'Status', render: (x) => h('span', { class: 'pill-row' }, x.status === 'absent' && session && session.status === 'open' ? ui.badge('not arrived yet', '') : ui.status(x.status), (x.flags || []).filter((f) => f === 'late' || f === 'corrected').map((f) => ui.badge(f)), x.enrolled === false ? ui.badge('not enrolled', 'warn') : null, x.spotCheck && x.spotCheck !== 'pending' ? ui.badge('spot: ' + x.spotCheck, x.spotCheck === 'confirmed' ? 'good' : 'bad') : null, x.spotCheck === 'pending' ? ui.badge('spot check pending', 'info') : null), text: (x) => x.status },
          { key: 'firstIn', label: 'In', render: (x) => x.firstIn ? fmt.time(x.firstIn) : '-', text: (x) => x.firstIn || 0 }, { key: 'lastOut', label: 'Out', render: (x) => x.lastOut ? fmt.time(x.lastOut) : '-', text: (x) => x.lastOut || 0 },
          { key: 'verifiedMinutes', label: 'Verified', align: 'right', render: (x) => fmt.mins(x.verifiedMinutes) },
          { key: 'method', label: 'How', text: (x) => [x.method, x.scannerRole, x.geofence, x.assurance].join(' '), render: howCell },
          { label: 'Phone app', sort: false, text: (x) => x.app ? [x.app.atLab, x.app.coveragePct].concat(x.app.flags).join(' ') : '', render: appCell },
          { label: '', sort: false, render: (x) => h('button', { class: 'btn btn-sm', 'aria-label': 'Actions for ' + x.name, onclick: () => rowActions(x) }, 'Actions') }],
        rows: [], empty: ui.empty('Nobody enrolled yet', 'Students appear here once enrolled or after they scan in.') });
      clear(body).append(banner, countsEl, actionsEl, panelSpot, tbl.el);
    }
    const open = s.status === 'open';
    clear(countsEl).append(ui.stat('Inside', c.inside, c.capacity ? 'of ' + c.capacity + ' seats' + (c.overCapacity ? ' (over capacity)' : '') : null, c.overCapacity ? 'bad' : 'good'), ui.stat('Left', c.left), ui.stat('Attended', c.attended, c.enrolled !== null ? 'of ' + c.enrolled + ' enrolled' : 'open to all'), ui.stat(open ? 'Not arrived yet' : 'Absent', c.absent === null ? '-' : c.absent), ui.stat('Exit not scanned', c.unverifiedExits, null, c.unverifiedExits ? 'warn' : ''), ui.stat('Flagged', c.flagged, null, c.flagged ? 'bad' : ''));
    clear(banner);
    if (c.rescanWindow) { const left = c.rescanWindow.closesAt - LF.now(); banner.append(h('div', { class: 'card sky', role: 'status' }, h('strong', null, 'Presence rescan in progress. '), 'Closes at ' + fmt.time(c.rescanWindow.closesAt) + ' (' + fmt.countdown(left) + ' left). Students inside must scan again.')); }
    if (!open) banner.append(h('div', { class: 'card flat' }, 'This session is ' + s.status + '. ', s.status === 'closed' ? 'Records are kept as scanned; use Actions for audited corrections.' : ''));
    if (c.onBreak) banner.append(h('div', { class: 'card sky' }, h('strong', null, 'Break. '), 'Attendance is paused until ' + fmt.time(s.breakEnd) + '; nobody needs to scan out for it.'));
    if (r.openFlags) banner.append(h('div', { class: 'card warn toolbar' }, h('strong', null, r.openFlags + ' open flag(s) for this session.'), h('button', { class: 'btn btn-sm', onclick: () => LF.go('flags') }, 'Review flags')));
    if (r.guests) banner.append(h('div', { class: 'hint' }, r.guests + ' guest(s) added by the event lead.'));
    clear(actionsEl);
    if (open && String(s.labMode || '').indexOf('B') >= 0) actionsEl.append(ui.button('Scan students', { kind: 'primary', icon: 'scan', onClick: () => LF.openPhoneScanner('Scan students: ' + s.title) }));
    if (open && r.appSession) actionsEl.append(ui.button('Fingerprint check now', { kind: 'primary', icon: 'check', onClick: async () => { const out = await api('presence.bioNow', { sessionId: s.sessionId }); LF.toast('Fingerprint check sent. Phones receive it within ' + Math.round(out.reachWithinSeconds / 60) + ' min; students then have 2 min.', 'good'); refresh(); } }));
    if (r.appSession) banner.append(h('div', { class: 'card flat' }, h('strong', null, 'Phone app session (tier 3). '), 'Phones report their location every few minutes and ask for a fingerprint at random times. Present needs most of the session at the lab, every fingerprint check passed and no open flag. Students without the app are flagged, not refused.'));
    if (open) actionsEl.append(ui.button('Request rescan now', { icon: 'refresh', onClick: async () => { await api('attend.openRescan', { sessionId: s.sessionId }); LF.toast('Rescan window opened', 'good'); refresh(); } }),
      ui.button('Random spot check', { icon: 'camera', onClick: async () => { const out = await api('spot.start', { sessionId: s.sessionId }); LF.toast(out.checks.length + ' student(s) selected for a spot check', 'good'); await drawSpot(s); } }),
      ui.button('Close session', { icon: 'x', onClick: async () => { await closeFlow({ sessionId: s.sessionId, title: s.title }, () => LF.go('live')); } }));
    actionsEl.append(ui.button('Reload', { size: 'sm', icon: 'refresh', onClick: () => refresh() }), h('span', { class: 'hint' }, 'Updated ' + fmt.time(LF.now()) + ' (auto-refresh 6 s)'));
    tbl.setRows(r.roster);
    drawSpot(s);
  }
  async function drawSpot(s) {
    try {
      const r = await api('spot.list', { sessionId: s.sessionId }), pend = r.checks.filter((x) => x.outcome === 'pending');
      clear(panelSpot);
      if (!pend.length) return;
      panelSpot.append(h('section', { class: 'card', 'aria-label': 'Pending spot checks' }, h('h2', { class: 't-h2' }, 'Spot checks to complete'), h('p', { class: 'hint' }, 'Find the student in the room, compare them with the photo on file, then record what you saw.'),
        h('div', { class: 'split' }, pend.map((c) => spotCard(c, s)))));
    } catch (e) { /* non-critical panel */ }
  }
  function spotCard(c, s) {
    const img = h('img', { class: 'photo', alt: 'Reference photo for ' + c.name, hidden: true }), note = h('span', { class: 'hint' }, c.hasPhoto ? '' : 'No photo on file: confirm identity with an ID card.');
    if (c.hasPhoto) api('photo.get', { studentId: c.studentId }).then((p) => { if (p.dataUrl) { img.src = p.dataUrl; img.hidden = false; } }).catch((e) => { note.textContent = LF.errMsg(e); });
    const resolve = (outcome) => async () => {
      let text = '';
      if (outcome !== 'confirmed') { text = await askNote(outcome === 'absent' ? 'Student not found in the room. Add a note:' : 'Photo does not match. Add a note:'); if (text === null) return; }

    };
    return h('div', { class: 'row', style: { alignItems: 'start' } }, h('div', { style: { display: 'flex', gap: '12px' } }, img, h('div', null, h('strong', null, c.name), h('div', { class: 'hint' }, c.rollNo), note)),
      h('div', { class: 'toolbar' }, ui.button('Matches', { size: 'sm', kind: 'primary', onClick: resolve('confirmed') }), ui.button('Does not match', { size: 'sm', kind: 'danger', onClick: resolve('mismatch') }), ui.button('Not in room', { size: 'sm', onClick: resolve('absent') })));
  }
  function askNote(title) {
    return new Promise((resolve) => { let done = false; const m = ui.formModal({ title, fields: [{ name: 'note', label: 'Note', type: 'textarea', rows: 2, required: true, maxlength: 200 }], submitLabel: 'Save', onSubmit: async (v) => { done = true; return v.note; }, onClose: (v) => resolve(done ? v : null) }); void m; });
  }
  function rowActions(x) {
    const s = session, open = s.status === 'open';
    const body = h('div', { style: { display: 'grid', gap: '10px' } },
      h('div', { class: 'hint' }, x.rollNo + ' · ' + x.name + ' · ' + x.status.replace(/_/g, ' ')),
      x.state !== 'in' ? ui.button('Add entry (student was present)', { block: true, onClick: () => correction(x, 'add_in') }) : null,
      x.state === 'in' ? ui.button('Add exit (student left)', { block: true, onClick: () => correction(x, 'add_out') }) : null,

      ui.button('Override the result', { block: true, onClick: () => overrideFlow(x) }),
      h('p', { class: 'hint' }, 'Corrections are logged with your name and reason. They never delete the original scan. Corrections on sessions older than the policy window need admin approval.'));
    const m = LF.modal('Actions: ' + x.name, body);
    function correction(x, action) {
      m.close();
      LF.ui.formModal({ title: action === 'add_in' ? 'Add entry for ' + x.name : 'Add exit for ' + x.name, intro: 'This overrides the scanner for this student only. Give the reason you would show an auditor.',
        fields: [{ name: 'at', label: 'Time (IST)', type: 'datetime-local', value: LF.util.msToIstInput(LF.now()), required: true }, { name: 'reason', label: 'Reason (min 10 characters)', type: 'textarea', rows: 2, required: true, maxlength: 300 }], submitLabel: 'Record correction',
        onSubmit: async (v) => { const r = await api('attend.correct', { sessionId: s.sessionId, studentId: x.studentId, action, at: LF.util.istToMs(v.at), reason: v.reason }); LF.toast(r.approvalStatus === 'pending' ? 'Sent to an admin for approval' : 'Correction recorded', 'good'); refresh(); } });
    }
    function overrideFlow(x) {
      m.close();
