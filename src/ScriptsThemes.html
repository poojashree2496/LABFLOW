<script>
/* Site themes. The administrator picks one (Settings > Appearance > uiTheme) and it applies to every user, the kiosks
   and the sign-in screen. A theme is a CSS file (styles/themes/<id>.css, every rule under [data-skin="<id>"]) plus the
   entry below: its fonts, the browser bar colour, the shell layout and optional hero / footer blocks for the shell.
   Layouts: 'sidebar' (menu on the left) or 'topnav' (menu across the top); a theme's CSS can rearrange further.
   Themes never restyle the QR codes or the camera preview: those stay black on white at full size so they scan. */
(function () {
'use strict';
const LF = window.LF, h = LF.h, icon = LF.icon;
const FONTS = 'https://fonts.googleapis.com/css2?display=swap&family=';

LF.SKINS = {
  karunya: {
    label: 'Karunya', layout: 'sidebar', color: '#ffffff',
    fonts: FONTS + 'Roboto:wght@400;500;700',
    hero(me, role) {
      const s = me.student, f = me.faculty;
      const meta = [s ? ['key', s.rollNo] : null, s && s.department ? ['book', [s.department, s.year ? 'Year ' + s.year : '', s.section ? 'Section ' + s.section : ''].filter(Boolean).join(' · ')] : null, f && f.department ? ['book', f.department] : null,
        ['users', { student: 'Student', faculty: 'Faculty', staff: 'Lab staff', admin: 'Administrator' }[role] || role], ['inbox', me.email]].filter(Boolean);
      return h('section', { class: 'skin-hero', 'aria-label': 'Your profile' },
        h('div', { class: 'hero-photo', 'aria-hidden': 'true' }, icon('user'), h('i', { class: 'hero-dot' })),
        h('div', { class: 'hero-body' }, h('div', { class: 'hero-name' }, me.displayName, h('span', { class: 'hero-tick', title: 'Verified university account' }, icon('verified'))),
          h('div', { class: 'hero-meta' }, meta.map(([ic, text]) => h('span', null, icon(ic), text)))));
    },
    foot() { return h('footer', { class: 'skin-foot' }, h('span', null, '© ' + new Date().getFullYear() + ' Karunya Institute of Technology and Sciences'), h('span', null, 'Powered by LABFLOW')); }
  },
  'neo-brutalism': {
    label: 'Neo-brutalism', layout: 'topnav', color: '#fdf3ea',
    fonts: FONTS + 'Lexend:wght@400;500;600;700',
    foot() { return h('footer', { class: 'skin-foot' }, h('span', null, 'Labflow · Karunya CSE laboratories'), h('span', { class: 'nb-dots', 'aria-hidden': 'true' }, ['#f26b6b', '#8f7cf2', '#3fc4ae', '#f9d84b', '#6aa7f4', '#f69d5a'].map((c) => h('i', { style: { background: c } })))); }
  },
  'pixel-art': {
    label: 'Pixel art', layout: 'sidebar', color: '#121212',
    fonts: FONTS + 'Silkscreen:wght@400;700&family=Pixelify+Sans:wght@700&family=Space+Mono:wght@400;700',
    foot() { return h('footer', { class: 'skin-foot' }, h('span', null, 'Labflow · Karunya CSE labs'), h('span', { class: 'px-press', 'aria-hidden': 'true' }, 'Press start')); }
  },
  'wabi-sabi': {
    label: 'Wabi-sabi', layout: 'topnav', color: '#f2efe8',
    fonts: FONTS + 'Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&family=Shippori+Mincho:wght@400',
    decor() {
      const box = h('div', { class: 'skin-decor', 'aria-hidden': 'true' }, h('span', { class: 'ws-tate', lang: 'ja' }, '研究室'), h('i', { class: 'ws-sun' }));
      box.appendChild(woodRings().cloneNode(true)); return box;
    },
    foot() { return h('footer', { class: 'skin-foot' }, h('span', { lang: 'ja' }, '一'), h('span', null, 'Labflow · Karunya CSE laboratories')); }
  },
  cybercore: {
    label: 'Cybercore', layout: 'topnav', color: '#e4e4e1',
    fonts: FONTS + 'Unbounded:wght@700;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500',
    hero(me, role) {
      const now = new Date(LF.now() + 330 * 60000), cell = (cls, label, extra) => h('div', { class: 'cc-cell ' + cls }, extra || null, label ? h('span', null, label) : null);
      return h('section', { class: 'skin-hero', 'aria-hidden': 'true' },
        cell('cc-blob', ''), cell('cc-path', 'K-01 / ' + role), cell('cc-grid', ''), cell('cc-cross', now.toISOString().slice(0, 10)),
        cell('cc-red', 'Karunya / CSE', h('b', null, now.toISOString().slice(11, 16))), cell('cc-noise', ''), cell('cc-checker', 'labs / live'));
    },
    foot() { return h('footer', { class: 'skin-foot' }, h('span', null, 'Labflow / Karunya CSE laboratories / ' + new Date().getFullYear()), h('b', null, 'Every lab session, accounted for')); }
  },
  'maximal-library': {
    label: 'Maximal library', layout: 'sidebar', color: '#ffffff',
    fonts: FONTS + 'Inter+Tight:wght@400;500;600;700&family=Archivo+Black&family=Anton',
    decor() {
      return h('div', { class: 'skin-decor', 'aria-hidden': 'true' }, h('div', { class: 'ml-blur' }, h('b', null, 'LAB'), h('b', null, 'FLOW'), h('i'), h('i')),
        h('div', { class: 'ml-fan' }, h('i'), h('i'), h('i'), h('i', null, 'Lab'), h('i'), h('i')));
    },
    foot() { return h('footer', { class: 'skin-foot' }, ['#111', '#c9cbcd', '#f5e43a', '#f2479a', '#4be37a'].map((c) => h('i', { 'aria-hidden': 'true', style: { background: c } })), h('span', null, 'Labflow · Karunya CSE laboratories')); }
  }
};
const DEFAULT = 'karunya';

/** Woodcut tree-ring cross-sections for wabi-sabi: lumpy off-centre rings from a seeded generator, so they look the
    same on every load. Built once, then cloned. */
let rings = null;
function woodRings() {
  if (rings) return rings;
  const NS = 'http://www.w3.org/2000/svg', el = (n, a, p) => { const e = document.createElementNS(NS, n); Object.keys(a).forEach((k) => e.setAttribute(k, a[k])); if (p) p.appendChild(e); return e; };
  const rng = (seed) => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const svg = el('svg', { viewBox: '0 0 600 600', class: 'ws-rings' });
  const f = el('filter', { id: 'ws-rough', x: '-5%', y: '-5%', width: '110%', height: '110%' }, el('defs', {}, svg));
  el('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.9', numOctaves: '2', seed: '4', result: 'n' }, f);
  el('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale: '3' }, f);
  const rand = rng(7), g = el('g', { filter: 'url(#ws-rough)', fill: 'none', stroke: '#141210', 'stroke-linecap': 'round' }, svg);
  const lumps = Array.from({ length: 5 }, (_, i) => ({ a: (0.03 + rand() * 0.06) / Math.pow(i + 1, 0.6), f: i + 2, p: rand() * 6.28 }));
  const shape = (t) => 1 + lumps.reduce((s, l) => s + l.a * Math.sin(l.f * t + l.p), 0);
  for (let i = 26; i >= 1; i--) {
    const k = Math.pow(i / 26, 0.9), wob = Array.from({ length: 3 }, () => ({ a: rand() * 0.012, f: 6 + Math.floor(rand() * 10), p: rand() * 6.28 }));
    let d = '';
    for (let s = 0; s <= 120; s++) {
      const t = s / 120 * Math.PI * 2, r = 330 * k * (shape(t) + wob.reduce((a, w) => a + w.a * Math.sin(w.f * t + w.p), 0));
      d += (s ? 'L' : 'M') + (420 + r * Math.cos(t)).toFixed(1) + ' ' + (180 + r * Math.sin(t)).toFixed(1);
    }
    el('path', { d, 'stroke-width': (3 + rand() * 5).toFixed(1) }, g);
  }
  return (rings = svg);
}

LF.skin = () => LF.SKINS[document.documentElement.getAttribute('data-skin')] || LF.SKINS[DEFAULT];
/** Switch the whole site to a theme: the data-skin hook for the CSS, only that theme's fonts, the browser bar colour. */
LF.applySkin = (id) => {
  if (!LF.SKINS[id]) id = DEFAULT;
  const root = document.documentElement, skin = LF.SKINS[id];
  root.setAttribute('data-skin', id); LF.pref('lf-skin', id);
  let link = document.getElementById('skin-fonts');
  if (!link) { link = document.createElement('link'); link.id = 'skin-fonts'; link.rel = 'stylesheet'; document.head.appendChild(link); }
  if (link.getAttribute('href') !== skin.fonts) link.setAttribute('href', skin.fonts);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', skin.color);
};
/* Wear the last theme this device saw until the server says otherwise (no flash of the default on every load). */
LF.applySkin(LF.pref('lf-skin') || DEFAULT);
})();
</script>
